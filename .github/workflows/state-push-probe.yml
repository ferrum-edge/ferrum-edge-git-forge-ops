name: State Push Probe

# TEMPORARY — delete once the question is answered.
#
# `main` now has a ruleset requiring the `reject-state-edits` status check.
# Ruleset required-status-checks gate direct pushes as well as merges, and
# GitHub Actions cannot be added to a ruleset bypass list ("Actor GitHub
# Actions integration must be part of the ruleset source or owner
# organization"). So it is an open question whether apply-on-merge.yml and
# rotate.yml can still push their state commits to main as github-actions[bot].
#
# This probe answers it with the same actor, token and code path as the real
# state commit, but an EMPTY commit — nothing in the tree changes, and no
# gateway is touched.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Attempt a bot push to main
        run: |
          set -uo pipefail
          git config user.name "gitforgeops[bot]"
          git config user.email "gitforgeops[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore(gitforgeops): ruleset bypass probe [skip ci]"

          if git push 2>push.log; then
            echo "RESULT: PUSH ALLOWED — the ruleset does not block github-actions[bot]."
            echo "### Probe result: push ALLOWED" >> "$GITHUB_STEP_SUMMARY"
            echo "The required status check does not block direct pushes by github-actions[bot]; apply-on-merge.yml and rotate.yml can keep committing state." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "RESULT: PUSH BLOCKED — the ruleset rejects github-actions[bot]."
            {
              echo "### Probe result: push BLOCKED"
              echo ""
              echo "The state commit in apply-on-merge.yml / rotate.yml would fail. Remove the ruleset or give the pushing actor a bypass."
              echo ""
              echo '```'
              cat push.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            cat push.log
          fi
