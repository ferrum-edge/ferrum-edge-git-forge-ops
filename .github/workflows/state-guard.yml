name: GitForgeOps State Guard
# A job that supplies a required check in an `edited`-triggered workflow must
# not use a job-level `if` that skips edited events; the newest skipped run can
# fail the release gate.

# `.state/<env>.json` is the ownership ledger: in shared mode it is the sole
# authority for which live gateway resources this repo may delete, and it also
# widens the namespace set that gets reconciled. It is written by CI only —
# apply-on-merge.yml and rotate.yml commit it back to main as gitforgeops[bot].
#
# A PR that hand-edits `.state` or its descendants is a privilege escalation, not a
# config change: forged entries name live resources as "previously managed"
# and the next post-merge apply deletes them. This job is the fence. Keeping
# the trust boundary here — rather than narrowing what the binary is willing
# to read out of the state file — is what lets shared mode keep reconciling
# namespaces the repo no longer declares, so orphaned resources still get
# cleaned up (see README "State file trust model").
#
# Escape hatch for genuine repairs (restoring a corrupted ledger, seeding an
# environment adopted from an existing gateway): a user with current write,
# maintain or admin permission labels the PR `gitforgeops/state-override` and
# submits a review (approve or comment) whose body is exactly
# `gitforgeops-state-override` on the current head. This is the rule
# `src/policy/github_override.rs` applies to policy overrides, decided by one
# default-branch helper (`.github/scripts/state_override.py`): the account
# that most recently added the label must hold the permission (read from
# `role_name` when it is a built-in rank, so Maintain counts as maintain) and
# must author the review. Triage users can apply labels but never authorize.
# The review names the exact commit, and the labeler's latest submitted review
# is their current word, so a later review revokes it and a push makes it
# stale. Re-run this job (or close and reopen the PR) after the review.
#
# The organization ruleset requires this file by path
# (docs/github-launch-controls.md, section 2a), so only a run of `main`'s
# definition satisfies the check and a deleted run cannot be replaced by a
# posted check. A listed workflow runs only on `opened`, `synchronize` and
# `reopened`; a label or review starts no run, which is why authority is read
# from the pull request at run time rather than from the triggering event.

# Deliberately `pull_request_target`, not `pull_request`. Both give this job a
# read-only token, but `pull_request` loads the *workflow definition from the
# pull request's own head*: a PR that edited `.state/x.json` and, in the same
# commit, deleted or neutered this file would run its own edited guard and pass.
# `pull_request_target` always loads the definition from the protected default
# branch, so the fence is the one main reviewed.
#
# The usual `pull_request_target` hazard — running privileged against untrusted
# code — does not apply because this job NEVER checks out the pull request. It
# reads changed files, labels, label events, reviews and collaborator
# permission through `gh api`, and gets its executable logic
# (`changed_files.py`, `state_override.py`) from an explicit default-branch
# checkout. No PR-authored byte is ever executed or interpolated into a `run:`
# block.
on:
  pull_request_target:
    # The ruleset starts runs only for opened, synchronize and reopened (see
    # above); a label or review is no trigger. `edited` (a base retarget)
    # stays for the supply-chain policy's retarget rule and for the case where
    # the workflow is ever unlisted; under the ruleset a retarget starts no run
    # and needs a reopen or push.
    types: [opened, synchronize, reopened, edited]
    # Deliberately NO `paths:` filter. This job is meant to be a required
    # status check for `main`, and a path-filtered workflow never reports a status on
    # matching-base PRs that don't match — GitHub then holds every such PR at "Expected —
    # waiting for status to be reported" forever. Running always and deciding
    # inside the job is what makes the check safe to require: it reports on
    # every PR to `main`, and passes in three seconds when `.state/` is untouched.
    branches: [main]

# Deliberately NO `concurrency:` group, at workflow or job level; the
# supply-chain policy refuses the word anywhere outside full-line comments, so
# keep it out of run scripts and trailing comments too. On #407, deliveries for
# one head started out of order, and a shared group cancelled the newest suite,
# leaving the required check cancelled beside an older success. The ruleset now
# starts runs only on opened, synchronize and reopened, but a cancelled run
# still leaves the required workflow unsatisfied until someone re-runs it, and
# nothing here needs cancellation.
#
# Nothing relies on which run branch protection selects for safety. Each run is
# bound to the head it was delivered for and fails closed if the PR head moves
# while it runs, and an authorizing run re-runs the whole override decision
# (head, base, label, labeler, permission and reviews) right before it records
# success. Revoking an override after a run has passed (a
# later review, removing the label) changes nothing until the job runs again:
# push, re-run it, or close and reopen the PR.

permissions:
  contents: read
  # Needed to list the PR's changed files, reviews and label events.
  pull-requests: read
  # Label events are issue events; read them with either grant.
  issues: read

jobs:
  state-guard-reject-state-edits:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # The only checkout in this workflow, and it names the protected default
      # branch explicitly. Never add a checkout of `github.event.pull_request.head.*`
      # here: under `pull_request_target` that would put PR-authored code in a
      # job holding the base repository's token.
      - name: Check out trusted guard logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted-guard
          persist-credentials: false

      - name: Detect .state and descendant changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Inspect both current and previous names. Looking only at
          # `filename` lets a rename from `.state/x.json` to another directory
          # evade the ownership-ledger guard.
          pages_file=$(mktemp)
          trap 'rm -f "$pages_file"' EXIT
          stable=false
          for attempt in 1 2 3; do
            before=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")
            before_head=$(jq -r '.head.sha' <<< "$before")
            before_base=$(jq -r '.base.sha' <<< "$before")
            before_ref=$(jq -r '.base.ref' <<< "$before")
            before_count=$(jq -r '.changed_files' <<< "$before")
            [[ "$before_head" =~ ^[0-9a-f]{40}$ && "$before_base" =~ ^[0-9a-f]{40}$ && "$before_count" =~ ^[0-9]+$ ]] || {
              echo "::error::GitHub returned invalid PR file metadata."
              exit 1
            }
            [ "$before_head" = "$EXPECTED_HEAD_SHA" ] || {
              echo "::error::PR head changed while the state guard was running; wait for the new run."
              exit 1
            }
            [ "$before_ref" = "$DEFAULT_BRANCH" ] || {
              echo "::error::State guard only trusts PRs targeting the protected default branch."
              exit 1
            }
            gh api "repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100" \
              --paginate --slurp > "$pages_file"
            after=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")
            after_head=$(jq -r '.head.sha' <<< "$after")
            after_base=$(jq -r '.base.sha' <<< "$after")
            after_ref=$(jq -r '.base.ref' <<< "$after")
            after_count=$(jq -r '.changed_files' <<< "$after")
            if [ "$before_head" = "$after_head" ] && [ "$before_base" = "$after_base" ] && \
               [ "$before_ref" = "$after_ref" ] && [ "$before_count" = "$after_count" ]; then
              current_changed=$after_count
              stable=true
              break
            fi
            echo "::warning::PR file metadata changed during attempt ${attempt}; retrying a stable snapshot."
          done
          [ "$stable" = true ] || {
            echo "::error::Could not obtain a stable PR file snapshot; state guard fails closed."
            exit 1
          }
          helper=trusted-guard/.github/scripts/changed_files.py
          if [ -f "$helper" ]; then
            result=$(python3 -I "$helper" "$pages_file" "$current_changed" state)
          else
            # One-time bootstrap for the PR that first adds the helper: its
            # base commit cannot contain the new file yet. Keep this equivalent
            # classifier inline so the guard still runs without executing a
            # candidate-branch script. After merge, the trusted helper path is
            # mandatory and used for every subsequent PR.
            result=$(jq -ce --argjson declared "$current_changed" '
              if type != "array" or any(.[]; type != "array") then
                error("invalid pagination shape")
              else
                [.[][]] as $records
                | if any($records[];
                    type != "object" or
                    (.filename | type) != "string" or
                    (has("previous_filename") and (.previous_filename | type) != "string"))
                  then error("invalid file entry")
                  else
                    ([$records[] | .filename, (.previous_filename // empty)] | unique) as $paths
                    | {
                        complete: (($records | length) == $declared and ($records | length) < 3000),
                        matched_paths: [$paths[] | select(. == ".state" or startswith(".state/"))]
                      }
                  end
              end
            ' "$pages_file")
          fi
          complete=$(jq -r '.complete' <<< "$result")
          count=$(jq '.matched_paths | length' <<< "$result")
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          if [ "$complete" != true ]; then
            # GitHub caps this endpoint at 3,000 files. Treat an incomplete
            # view as potentially containing protected state paths, then route
            # it through the same current-head, permission-attributed override
            # path as a known state edit. This remains fail closed without an
            # authorized override but does not make an intentionally reviewed
            # large PR permanently unmergeable.
            echo "requires_override=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Changed-file pagination was incomplete; an authorized state override is required."
          elif [ "$count" -eq 0 ]; then
            echo "requires_override=false" >> "$GITHUB_OUTPUT"
            echo "No .state or descendant changes in this PR."
          else
            echo "requires_override=true" >> "$GITHUB_OUTPUT"
            echo "This PR changes ${count} current or previous .state or descendant path(s):"
            jq -r '.matched_paths[] | "  " + @json' <<< "$result"
          fi

      - name: Verify state-override authority
        id: authorize
        if: ${{ steps.detect.outputs.requires_override == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          OVERRIDE_LABEL: gitforgeops/state-override
          OVERRIDE_REVIEW: gitforgeops-state-override
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          # The decision is `state_override.py` from the default-branch
          # checkout, the same rule `src/policy/github_override.rs` applies to
          # policy overrides: the account that last added the exact label
          # holds current write, maintain or admin permission (`role_name`
          # first) and its latest submitted review authorizes this exact head.
          # Event and review histories are numbered pages read until one is
          # empty, never `--paginate`, and the decision ends with a re-read of
          # the PR, labeler, permission and reviews. It queries current state,
          # never the triggering event: a re-run replays the original payload,
          # and a label or review starts no run of its own. The helper prints
          # its validated evidence, and nothing else, only when it authorizes;
          # its diagnostics go to stderr.
          override=trusted-guard/.github/scripts/state_override.py
          [ -f "$override" ] || {
            echo "::error::The trusted state-override helper is missing; the override is not authorized."
            exit 1
          }
          python3 -I "$override" authorize >> "$GITHUB_OUTPUT"
          {
            echo "run_id=$RUN_ID"
            echo "run_attempt=$RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"

      - name: Reject unauthorized PR-authored state changes
        if: ${{ steps.detect.outputs.requires_override == 'true' && steps.authorize.outcome != 'success' }}
        run: |
          echo "::error::This PR modifies .state or its descendants, or exceeds GitHub's complete changed-file enumeration; an authorized override is required."
          cat >> "$GITHUB_STEP_SUMMARY" <<'MSG'
          ## Blocked: protected state scope cannot be cleared automatically

          `.state/<env>.json` records which gateway resources this repo has
          applied. In `shared` ownership mode it is the only thing standing
          between a live resource and a delete, so a hand-edited state file can
          cause the next post-merge apply to remove resources the repo never
          managed. GitHub also caps changed-file enumeration at 3,000 entries;
          when that view is incomplete, this guard conservatively assumes the
          unseen tail could contain a protected state path.

          It is maintained by CI: `apply-on-merge.yml` and `rotate.yml` commit
          it as `gitforgeops[bot]` after a successful run. Drop changes to `.state`
          and its descendants from this PR and let the next apply write them.

          If you are deliberately repairing or seeding the ledger, a user with
          current `write`, `maintain`, or `admin` repository permission adds
          the exact `gitforgeops/state-override` label and then submits a
          review (approve or comment) whose body is exactly
          `gitforgeops-state-override` on the current head. The account that
          last added the label must be the reviewer. Then re-run this job, or
          close and reopen the pull request: a label or review starts no run.
          Triage permission cannot authorize, a later review by the same user
          revokes it, and a push needs a fresh review.
          MSG
          exit 1

      - name: Record authorized override
        if: ${{ steps.detect.outputs.requires_override == 'true' && steps.authorize.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          OVERRIDE_LABEL: gitforgeops/state-override
          OVERRIDE_REVIEW: gitforgeops-state-override
          ACTOR: ${{ steps.authorize.outputs.actor }}
          PERMISSION: ${{ steps.authorize.outputs.permission }}
          REVIEW_ID: ${{ steps.authorize.outputs.review_id }}
          AUTHORIZED_HEAD: ${{ steps.authorize.outputs.head_sha }}
          RUN_ID: ${{ steps.authorize.outputs.run_id }}
          RUN_ATTEMPT: ${{ steps.authorize.outputs.run_attempt }}
        run: |
          set -euo pipefail

          # Final recheck, immediately before this run reports success. The
          # head, base, label, labeler, the labeler's permission and the
          # reviews may all have changed since authorization; a push, a
          # retarget, a label removed or re-applied by someone else, a
          # demotion or a later review must fail this run rather than leave a success on the head.
          # The helper runs the whole decision again and requires the same
          # labeler, review and head the authorize step recorded.
          # `check_supply_chain.py` requires this block.
          override=trusted-guard/.github/scripts/state_override.py
          [ -f "$override" ] || {
            echo "::error::The trusted state-override helper is missing; the override is not recorded."
            exit 1
          }
          python3 -I "$override" recheck

          echo "::warning::Protected state scope authorized by @${ACTOR} (${PERMISSION}) in review ${REVIEW_ID} for head ${AUTHORIZED_HEAD}."
          {
            echo "## Authorized protected-state override"
            echo
            echo "- Reviewer: \`@${ACTOR}\`"
            echo "- Current permission: \`${PERMISSION}\`"
            echo "- Review: \`${REVIEW_ID}\`"
            echo "- Authorized head: \`${AUTHORIZED_HEAD}\`"
            echo "- Workflow run: \`${RUN_ID}\` (attempt \`${RUN_ATTEMPT}\`)"
          } >> "$GITHUB_STEP_SUMMARY"
