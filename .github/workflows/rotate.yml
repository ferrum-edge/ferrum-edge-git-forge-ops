name: GitForgeOps Rotate Credential

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (name from .gitforgeops/config.yaml)
        required: true
        type: string
      consumer:
        description: Consumer id
        required: true
        type: string
      credential:
        description: "Credential slot path: <type>/<field>, e.g. `keyauth/key`, `jwt/secret`, `hmac_auth/secret`, `basicauth/password`. Credentials are arrays and index 0 is elided, so a second entry is `keyauth/[1]/key`."
        required: true
        type: string
      namespace:
        description: Namespace (defaults to `ferrum`)
        required: false
        type: string
        default: ferrum

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Require protected default branch
        env:
          SOURCE_REF: ${{ github.ref }}
          EXPECTED_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          [ "$SOURCE_REF" = "$EXPECTED_REF" ] || {
            echo "::error::Credential rotation may run only from $EXPECTED_REF."
            exit 1
          }

  rotate:
    needs: preflight
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    concurrency:
      group: ferrum-apply-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Validate environment input
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          [[ "$INPUT_ENVIRONMENT" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]] || {
            echo "::error::Environment must be a single safe path component."
            exit 1
          }

      - name: Validate API-mode routing
        id: deployment-mode
        env:
          RAW_MODE: ${{ vars.FERRUM_GATEWAY_MODE }}
        run: |
          set -euo pipefail
          mode=$(printf '%s' "${RAW_MODE:-api}" | tr '[:upper:]' '[:lower:]' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          [ -n "$mode" ] || mode=api
          case "$mode" in
            api) ;;
            file)
              echo "::error::Credential rotation requires API mode; file mode has no live consumer update path."
              exit 1
              ;;
            *)
              echo "::error::Invalid FERRUM_GATEWAY_MODE '$RAW_MODE'; expected api or file."
              exit 1
              ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Mint narrowly scoped state-writer token
        id: state-writer
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.GITFORGEOPS_STATE_APP_ID }}
          private-key: ${{ secrets.GITFORGEOPS_STATE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Check out protected main for rotation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.state-writer.outputs.token }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action; Rust 1.98.0
        with:
          toolchain: 1.98.0

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install gitforgeops
        run: cargo install --path . --locked

      - name: Require a configured environment
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          configured=$(gitforgeops envs --format json)
          jq -e --arg target "$INPUT_ENVIRONMENT" \
            'type == "array" and index($target) != null' <<< "$configured" >/dev/null || {
            echo "::error::Environment is not declared by the protected main configuration."
            exit 1
          }

      - name: Load credential bundles
        # File-path routing around OS env-block size limits. See
        # apply-on-merge.yml for the full rationale.
        run: |
          set -euo pipefail
          all_secrets=$(mktemp)
          trap 'rm -f "$all_secrets"' EXIT
          cat > "$all_secrets" <<'SECRETS_EOF'
          ${{ toJSON(secrets) }}
          SECRETS_EOF
          creds_file="${RUNNER_TEMP:-/tmp}/ferrum-creds-${GITHUB_RUN_ID}-${GITHUB_JOB}-$$.json"
          python3 .github/scripts/credential_bundles.py "$all_secrets" "$creds_file"
          echo "FERRUM_CREDS_JSON_FILE=$creds_file" >> "$GITHUB_ENV"

      - name: Rotate
        # Rotate now pushes the updated consumer to the live gateway, so it
        # needs the full gateway-connection secret set that apply-on-merge
        # has. Without the TLS material, rotate fails to connect in envs
        # that require a custom CA or mTLS, even though apply-on-merge and
        # drift-check are configured correctly for the same env.
        #
        # Route workflow_dispatch inputs through env vars and reference
        # $INPUT_* shell variables — never interpolate
        # `${{ inputs.* }}` directly into the run block. Inputs are user-
        # controlled and can contain quote/command-substitution sequences
        # that would escape a double-quoted `"${{ inputs.X }}"` arg.
        # FERRUM_GATEWAY_MODE set explicitly so the binary reads it from
        # the process env, not just the `vars.*` gate context.
        env:
          FERRUM_ENV: ${{ inputs.environment }}
          # Pass the repo's actual gateway mode through. Hardcoding `api`
          # here meant a file-mode repo's rotate would slip past the
          # binary's mode preflight, write the GitHub Env Secret, and only
          # fail later when the Admin API config was missing — leaving
          # the store mutated with no corresponding gateway push path.
          FERRUM_GATEWAY_MODE: ${{ steps.deployment-mode.outputs.mode }}
          FERRUM_GATEWAY_URL: ${{ secrets.FERRUM_GATEWAY_URL }}
          FERRUM_ADMIN_JWT_SECRET: ${{ secrets.FERRUM_ADMIN_JWT_SECRET }}
          FERRUM_GATEWAY_CA_CERT: ${{ secrets.FERRUM_GATEWAY_CA_CERT }}
          FERRUM_GATEWAY_CLIENT_CERT: ${{ secrets.FERRUM_GATEWAY_CLIENT_CERT }}
          FERRUM_GATEWAY_CLIENT_KEY: ${{ secrets.FERRUM_GATEWAY_CLIENT_KEY }}
          FERRUM_GH_PROVISIONER_TOKEN: ${{ secrets.FERRUM_GH_PROVISIONER_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          INPUT_CONSUMER: ${{ inputs.consumer }}
          INPUT_CREDENTIAL: ${{ inputs.credential }}
          INPUT_NAMESPACE: ${{ inputs.namespace }}
          INPUT_RECIPIENT: ${{ github.actor }}
        run: |
          set -euo pipefail
          gitforgeops rotate \
            --consumer "$INPUT_CONSUMER" \
            --credential "$INPUT_CREDENTIAL" \
            --namespace "$INPUT_NAMESPACE" \
            --recipient "$INPUT_RECIPIENT"

      - name: Commit state update
        # Rotation metadata (last_rotated, sha256_prefix, delivered_to) lives
        # in .state/<env>.json. If we can't persist the update, a stale state
        # misleads the next drift check — fail the job on push failure, and
        # retry on rejection (possible if an apply landed concurrently).
        # Same shell-injection protection as the Rotate step: route inputs
        # through env vars.
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_CONSUMER: ${{ inputs.consumer }}
          INPUT_CREDENTIAL: ${{ inputs.credential }}
        run: |
          set -euo pipefail
          git config user.name "gitforgeops[bot]"
          git config user.email "gitforgeops[bot]@users.noreply.github.com"
          mkdir -p .state
          # No `|| true`: a failing `git add` (gitignored path, bad perms)
          # must fail the job rather than silently commit nothing.
          if [ -f ".state/${INPUT_ENVIRONMENT}.json" ]; then
            git add ".state/${INPUT_ENVIRONMENT}.json"
          fi
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "chore(gitforgeops): rotate ${INPUT_CONSUMER}.${INPUT_CREDENTIAL} in ${INPUT_ENVIRONMENT} [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "Push rejected on attempt $attempt; rebasing..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((attempt * 2))
          done
          echo "ERROR: failed to push rotation state after 5 attempts" >&2
          exit 1
