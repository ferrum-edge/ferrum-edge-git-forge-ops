name: GitForgeOps Validator Pin Canary

# Upstream ferrum-edge publishes production artifacts only for version tags.
# Assets on a given tag are immutable; a new version tag is a new candidate.
# Every workflow installs exactly the release release/baseline.json pins, so a
# new upstream release never breaks validation by itself. This canary checks
# daily that the pinned build still installs (publisher checksum, baseline
# digest and reviewed allowlist agree) and accepts resource labels, and it
# reports when Ferrum Edge has published a newer release than the pin, handing
# a maintainer the exact reviewed allowlist line for it. Moving the pin is a
# reviewed change to the allowlist and release/baseline.json together.
#
# The weekly `edge-main-drift` job is the forward-looking half of the same
# pairing check (ferrum-edge/ferrum-contracts#76): it runs the validator and
# the lifecycle suite with the gateway Edge `main` would ship next, so a
# breaking change there shows up before a release pairs with it. It runs on
# its own cron entry or when dispatched with `check: edge-main`; the canary
# job runs on the daily entry or `check: validator-pin`.
on:
  schedule:
    - cron: '17 7 * * *'
    # Edge main early warning, weekly.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      check:
        description: Which check to run
        type: choice
        options:
          - validator-pin
          - edge-main
        default: validator-pin

permissions:
  contents: read

concurrency:
  group: validator-pin-canary
  cancel-in-progress: false

jobs:
  validator-pin-canary:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '17 7 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.check == 'validator-pin')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      ISSUE_TITLE: Refresh the pinned ferrum-edge validator digest
      ISSUE_MARKER: '<!-- gitforgeops:validator-pin-canary -->'
    steps:
      - name: Require protected default branch
        env:
          SOURCE_REF: ${{ github.ref }}
          EXPECTED_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          [ "$SOURCE_REF" = "$EXPECTED_REF" ] || {
            echo "::error::The validator pin canary may run only from $EXPECTED_REF."
            exit 1
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify the reviewed validator digest
        id: install
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          status=0
          bash .github/scripts/install-ferrum-edge.sh \
            "$RUNNER_TEMP/validator-canary/ferrum-edge" || status=$?
          echo "status=$status" >>"$GITHUB_OUTPUT"

      # Keep the downloaded executable out of the token-bearing install process
      # tree: env -i protects only its direct environment, not Linux /proc.
      - name: Verify resource-label support without a GitHub token
        id: verify
        if: steps.install.outputs.status == '0'
        run: |
          set -uo pipefail
          status=0
          bash .github/scripts/check-validator-resource-labels.sh \
            "$RUNNER_TEMP/validator-canary/ferrum-edge" || status=$?
          echo "status=$status" >>"$GITHUB_OUTPUT"

      - name: Compute the pinned allowlist line
        id: refresh
        if: steps.install.outputs.status != '0'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          line=$(bash .github/scripts/refresh-ferrum-edge-pin.sh)
          {
            echo 'line<<CANARY_EOF'
            printf '%s\n' "$line"
            echo 'CANARY_EOF'
          } >>"$GITHUB_OUTPUT"

      # Informational: a newer upstream release is reported, never installed.
      # A failed lookup leaves the tracking issue as it is.
      - name: Check for a newer upstream release
        id: newer
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          pinned=$(jq -er '.validator.version' release/baseline.json) || pinned=
          if ! newest=$(bash .github/scripts/refresh-ferrum-edge-pin.sh --newest) || [ -z "$pinned" ]; then
            echo "lookup=failed" >>"$GITHUB_OUTPUT"
            echo "tag=" >>"$GITHUB_OUTPUT"
            echo "::warning::The newest published Ferrum Edge release could not be compared with the pin."
            exit 0
          fi
          echo "lookup=ok" >>"$GITHUB_OUTPUT"
          echo "pinned=$pinned" >>"$GITHUB_OUTPUT"
          if [ "$newest" = "$pinned" ]; then
            echo "tag=" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$newest" >>"$GITHUB_OUTPUT"
          echo "::warning::Ferrum Edge $newest is published; release/baseline.json pins $pinned."
          line=$(bash .github/scripts/refresh-ferrum-edge-pin.sh --release "$newest") || line=
          {
            echo 'line<<CANARY_EOF'
            printf '%s\n' "$line"
            echo 'CANARY_EOF'
          } >>"$GITHUB_OUTPUT"

      # `!cancelled()`: without a status function the condition is implicitly
      # `success() && ...`, so a failed refresh after a failed install would
      # skip this step exactly when the pairing is broken.
      - name: Open or update the tracking issue
        if: ${{ !cancelled() && (steps.install.outputs.status != '0' || steps.verify.outputs.status != '0' || steps.newer.outputs.tag != '') }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          INSTALL_STATUS: ${{ steps.install.outputs.status }}
          VERIFY_STATUS: ${{ steps.verify.outputs.status }}
          ALLOWLIST_LINE: ${{ steps.refresh.outputs.line }}
          PINNED_TAG: ${{ steps.newer.outputs.pinned }}
          NEWER_TAG: ${{ steps.newer.outputs.tag }}
          NEWER_LINE: ${{ steps.newer.outputs.line }}
        run: |
          set -euo pipefail
          {
            printf '%s\n\n' "$ISSUE_MARKER"
            if [ "$INSTALL_STATUS" != '0' ] || [ "$VERIFY_STATUS" != '0' ]; then
              cat <<EOF
          ## The pinned validator pairing failed

          Either the build release/baseline.json pins no longer installs (the
          publisher checksum, the baseline digest and the reviewed
          \`.github/ferrum-edge-checksums.txt\` allowlist must all agree), or
          the verified binary rejected the minimal fixture with labels on all
          four gateway resource kinds. Every workflow that runs
          \`ferrum-edge validate\` fails until this is fixed. See the canary
          log for the original diagnostic. Git Forge Ops always emits resource
          labels and requires a build including ferrum-edge#5483.

          When the pinned digest is missing from the allowlist, the line below
          is computed from the publisher checksum and checked against the
          baseline digest. Review the upstream build before appending it:

          \`\`\`
          $ALLOWLIST_LINE
          \`\`\`

          If no line is shown, either installation succeeded but label
          validation failed, or computing the line failed too (see the canary
          log). Do not re-approve the same incompatible build. Regenerate the
          line with:

          \`\`\`bash
          bash .github/scripts/refresh-ferrum-edge-pin.sh --append
          \`\`\`

          EOF
            fi
            if [ -n "$NEWER_TAG" ]; then
              cat <<EOF
          ## A newer Ferrum Edge release is published

          Ferrum Edge $NEWER_TAG is published; release/baseline.json pins
          $PINNED_TAG, and every workflow keeps installing exactly the pinned
          build. Adopting the new release is a reviewed change: append its
          allowlist line, move \`validator\` and \`tested_gateway\` in
          release/baseline.json, the Dockerfile gateway stage and the paired
          contracts together, and qualify the new pairing. Candidate allowlist
          line, computed from the publisher checksum (empty when that failed):

          \`\`\`
          $NEWER_LINE
          \`\`\`

          Regenerate it with:

          \`\`\`bash
          bash .github/scripts/refresh-ferrum-edge-pin.sh --release $NEWER_TAG --append
          \`\`\`

          EOF
            fi
            echo "Keep previous approved digests. The PR's required static-validation"
            echo 'check must also accept the labeled fixture before a new pairing'
            echo 'can merge; an allowlist entry alone does not prove compatibility.'
            echo
            echo "Canary run: $RUN_URL"
          } >issue-body.md

          number=$(gh api --paginate "repos/$REPO/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null) | [.number, .title] | @tsv' \
            | awk -F'\t' -v title="$ISSUE_TITLE" '$2 == title { print $1; exit }')

          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$REPO" --body-file issue-body.md
            echo "::notice::Updated tracking issue #$number."
          else
            gh issue create --repo "$REPO" --title "$ISSUE_TITLE" --body-file issue-body.md
            echo "::notice::Opened a tracking issue for the validator pin."
          fi

      - name: Close a resolved tracking issue
        if: steps.install.outputs.status == '0' && steps.verify.outputs.status == '0' && steps.newer.outputs.lookup == 'ok' && steps.newer.outputs.tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          number=$(gh api --paginate "repos/$REPO/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null) | [.number, .title] | @tsv' \
            | awk -F'\t' -v title="$ISSUE_TITLE" '$2 == title { print $1; exit }')
          if [ -n "$number" ]; then
            gh issue close "$number" --repo "$REPO" \
              --comment 'The pinned validator installs, accepts resource labels on all four gateway resource kinds, and is the newest published Ferrum Edge release.'
            echo "::notice::Closed resolved tracking issue #$number."
          fi

      - name: Fail when the validator pairing is invalid
        if: ${{ !cancelled() && (steps.install.outputs.status != '0' || steps.verify.outputs.status != '0') }}
        run: |
          echo "::error::The pinned validator digest or resource-label compatibility check failed; see the tracking issue."
          exit 1

  # Every other workflow runs the reviewed release validator from the digest
  # allowlist. This job runs the gateway Edge `main` would ship next, so it
  # holds `contents: read` only, binds no environment or secret, and never
  # touches the allowlist or the release evidence: the binary is trusted only
  # because Edge's Main Latest Image workflow signed the image it comes from.
  edge-main-drift:
    name: Edge main early warning
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '17 6 * * 1') ||
      (github.event_name == 'workflow_dispatch' && inputs.check == 'edge-main')
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.report.outputs.outcome }}
      edge-commit: ${{ steps.edge.outputs.commit }}
      report: ${{ steps.report.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        id: checkout
        with:
          persist-credentials: false

      # From the pinned action's checksum manifest, as security.yml installs
      # cargo-audit; the repository's allowed-actions list has no
      # sigstore action.
      - name: Install Cosign
        id: cosign
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cosign@3.1.4
          checksum: true
          fallback: none

      # Edge's Main Latest Image workflow moves `latest` only to a main commit
      # whose push CI passed, and signs the image keylessly. The tag is
      # mutable: the digest is resolved once, its signature is verified
      # against that workflow on `main`, and the gateway binary is copied out
      # of that digest. The Edge commit is the image's revision label, part of
      # the signed image, and it must be on Edge main's history.
      - name: Resolve the Ferrum Edge main image
        id: edge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository=ghcr.io/ferrum-edge/ferrum-edge
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:ferrum-edge/ferrum-edge:pull" | jq -er .token)
          digest=$(curl -fsS --head -o /dev/null -D - \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/ferrum-edge/ferrum-edge/manifests/latest" \
            | tr -d '\r' | awk -F': ' 'tolower($1) == "docker-content-digest" { print $2 }')
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected digest for $repository:latest: $digest"
            exit 1
          fi
          image="$repository@$digest"
          if ! cosign verify "$image" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity https://github.com/ferrum-edge/ferrum-edge/.github/workflows/main-latest-image.yml@refs/heads/main \
            --certificate-github-workflow-repository ferrum-edge/ferrum-edge \
            --certificate-github-workflow-ref refs/heads/main \
            --certificate-github-workflow-trigger workflow_run \
            > "$RUNNER_TEMP/cosign-verify.json"; then
            echo "::error::$image has no valid signature from Edge's Main Latest Image workflow"
            exit 1
          fi
          docker pull --quiet --platform linux/amd64 "$image"
          commit=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")
          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::$image carries no readable revision label: $commit"
            exit 1
          fi
          # Read main only now: the image can move to a newer commit between an
          # earlier read and the label, which would look like "behind".
          main_head=$(git ls-remote https://github.com/ferrum-edge/ferrum-edge refs/heads/main | cut -f1)
          if ! [[ "$main_head" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve Ferrum Edge main: $main_head"
            exit 1
          fi
          compare=$(gh api "repos/ferrum-edge/ferrum-edge/compare/$commit...$main_head" \
            --jq '"\(.status) \(.ahead_by)"')
          read -r on_main behind <<< "$compare"
          case "$on_main" in
            ahead | identical) ;;
            *)
              echo "::error::$image names $commit, which is not on Ferrum Edge main's history ($on_main)"
              exit 1
              ;;
          esac
          bin_dir="$RUNNER_TEMP/edge-main-bin"
          mkdir -p "$bin_dir"
          container=$(docker create --platform linux/amd64 "$image")
          docker cp "$container:/app/ferrum-edge" "$bin_dir/ferrum-edge"
          docker rm "$container" > /dev/null
          chmod 0755 "$bin_dir/ferrum-edge"

          # ferrum-contracts records what Edge main changes in each
          # vocabulary's main_branch_delta; its commit is the anchor.
          contracts=$(git ls-remote https://github.com/ferrum-edge/ferrum-contracts refs/heads/main | cut -f1)
          if ! [[ "$contracts" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve ferrum-contracts main: $contracts"
            exit 1
          fi
          # A missing or unreadable vocabulary, or a failed compare call, is one
          # report row, never an abort or a claim about history.
          vocabulary="https://raw.githubusercontent.com/ferrum-edge/ferrum-contracts/$contracts/vocabularies/plugin-catalog.json"
          if catalog=$(curl -fsS "$vocabulary" 2>/dev/null) &&
            delta=$(jq -r '.main_branch_delta.commit // ""' <<< "$catalog" 2>/dev/null); then
            if [[ "$delta" =~ ^[0-9a-f]{40}$ ]]; then
              status=$(gh api "repos/ferrum-edge/ferrum-edge/compare/$delta...$commit" --jq .status 2>/dev/null || true)
              case "$status" in
                identical) delta_note="read at this commit" ;;
                ahead) delta_note="read at an older commit; changes after it may not be recorded yet" ;;
                behind) delta_note="read at a newer commit than this image" ;;
                diverged) delta_note="not on this commit's history" ;;
                *) delta_note="could not be compared with this commit (the compare API call failed)" ;;
              esac
            else
              delta="none"
              delta_note="ferrum-contracts main records no main_branch_delta"
            fi
          else
            delta="none"
            delta_note="vocabularies/plugin-catalog.json could not be read from ferrum-contracts main"
          fi

          {
            echo "image=$image"
            echo "binary=$bin_dir/ferrum-edge"
            echo "commit=$commit"
            echo "main-head=$main_head"
            echo "behind=$behind"
            echo "contracts=$contracts"
            echo "delta=$delta"
            echo "delta-note=$delta_note"
          } >> "$GITHUB_OUTPUT"
          echo "Checking Ferrum Edge main at $commit ($image), $behind commit(s) behind main $main_head."

      - name: Require resource-label compatibility from Edge main
        id: labels
        continue-on-error: true
        env:
          EDGE_BINARY: ${{ steps.edge.outputs.binary }}
        run: bash .github/scripts/check-validator-resource-labels.sh "$EDGE_BINARY"

      - name: Install Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action; Rust 1.100.0
        with:
          toolchain: 1.100.0

      # No cache is restored or published.
      - name: Install gitforgeops
        id: install
        run: cargo install --path . --locked

      - name: Validate every environment with Edge main
        id: validate
        continue-on-error: true
        env:
          FERRUM_EDGE_BINARY_PATH: ${{ steps.edge.outputs.binary }}
        run: |
          set -euo pipefail
          envs=$(gitforgeops envs --format json | jq -c .)
          jq -e '
            type == "array" and
            all(.[]; type == "string" and test("^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"))
          ' <<< "$envs" > /dev/null || {
            echo "::error::Every environment must be a single safe path component."
            exit 1
          }
          status=0
          for environment in $(jq -r '.[]' <<< "$envs"); do
            echo "::group::validate $environment"
            FERRUM_ENV="$environment" gitforgeops validate --format github-annotations || status=1
            echo "::endgroup::"
          done
          exit "$status"

      # The lifecycle suite's apply, diff (drift) and traffic scenarios
      # against a loopback gateway started from the Edge main binary. The
      # result file stays in the runner: only lifecycle.yml's results reach
      # the release gate.
      - name: Run the lifecycle suite against Edge main
        id: lifecycle
        continue-on-error: true
        env:
          FERRUM_EDGE_BINARY_PATH: ${{ steps.edge.outputs.binary }}
          LIFECYCLE_RESULT: ${{ runner.temp }}/edge-main-lifecycle-result.json
        # The scenarios run gitforgeops, which finds `ferrum-edge` on PATH (in
        # lifecycle.yml the installer puts it there), so put the Edge main
        # binary first on this step's PATH.
        run: |
          set -euo pipefail
          PATH="$(dirname -- "$FERRUM_EDGE_BINARY_PATH"):$PATH" bash tests/lifecycle/run.sh

      - name: Write the report
        # Always, so a run that could not check anything still reaches the
        # tracking issue as `error` instead of going silent.
        id: report
        if: ${{ !cancelled() }}
        env:
          EDGE_IMAGE_REF: ${{ steps.edge.outputs.image }}
          EDGE_COMMIT: ${{ steps.edge.outputs.commit }}
          MAIN_HEAD: ${{ steps.edge.outputs.main-head }}
          BEHIND: ${{ steps.edge.outputs.behind }}
          CONTRACTS: ${{ steps.edge.outputs.contracts }}
          DELTA: ${{ steps.edge.outputs.delta }}
          DELTA_NOTE: ${{ steps.edge.outputs.delta-note }}
          LABELS: ${{ steps.labels.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          LIFECYCLE: ${{ steps.lifecycle.outcome }}
          SETUP_CHECKOUT: ${{ steps.checkout.outcome }}
          SETUP_COSIGN: ${{ steps.cosign.outcome }}
          SETUP_EDGE: ${{ steps.edge.outcome }}
          SETUP_TOOLCHAIN: ${{ steps.toolchain.outcome }}
          SETUP_INSTALL: ${{ steps.install.outcome }}
        run: |
          set -euo pipefail
          verdict() {
            case "$1" in
              success) echo pass ;;
              skipped) echo "not run" ;;
              *) echo "**FAIL**" ;;
            esac
          }
          # A setup step that did not succeed means nothing was compared.
          failed_setup=""
          for entry in checkout="$SETUP_CHECKOUT" install-cosign="$SETUP_COSIGN" \
            resolve-edge-main-image="$SETUP_EDGE" install-rust-toolchain="$SETUP_TOOLCHAIN" \
            install-gitforgeops="$SETUP_INSTALL"; do
            [ "${entry#*=}" = success ] || failed_setup="$failed_setup ${entry%%=*}"
          done
          outcome=clean
          for result in "$LABELS" "$VALIDATE" "$LIFECYCLE"; do
            [ "$result" = success ] || outcome=drift
          done
          [ -z "$failed_setup" ] || outcome=error
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          report="$RUNNER_TEMP/edge-main-drift.md"
          {
            echo "<!-- edge-main-drift -->"
            if [ "$outcome" = error ]; then
              echo "The Edge main drift check could not run: \`${failed_setup# }\` did not succeed, so the checks below did not run against Ferrum Edge \`main\`. See the run log; a clean scheduled run closes this issue."
            elif [ "$outcome" = drift ]; then
              echo "\`$GITHUB_REPOSITORY\` fails checks against Ferrum Edge \`main\`. This is an early warning: the change is on Edge \`main\` and not released yet, so there is time to ship a compatible GitForgeOps release before Edge releases it."
            else
              echo "\`$GITHUB_REPOSITORY\` passes its checks against Ferrum Edge \`main\`."
            fi
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Edge commit checked | [\`${EDGE_COMMIT:0:12}\`](https://github.com/ferrum-edge/ferrum-edge/commit/$EDGE_COMMIT), \`/app/ferrum-edge\` from \`$EDGE_IMAGE_REF\` (signed by Edge's Main Latest Image workflow) |"
            echo "| Edge \`main\` | \`${MAIN_HEAD:0:12}\`, $BEHIND commit(s) after the checked commit |"
            echo "| ferrum-contracts \`main_branch_delta\` | \`${DELTA:0:12}\` at contracts \`${CONTRACTS:0:12}\`: $DELTA_NOTE |"
            echo "| Run | $run_url |"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Resource labels on all four gateway resource kinds (\`check-validator-resource-labels.sh\`) | $(verdict "$LABELS") |"
            echo "| \`gitforgeops validate\` for every environment | $(verdict "$VALIDATE") |"
            echo "| Lifecycle suite (\`tests/lifecycle/run.sh\`: apply, diff and traffic against a real gateway) | $(verdict "$LIFECYCLE") |"
            echo
            echo "The run log has each failure. A clean scheduled run closes this issue."
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "outcome=$outcome"
            echo "report=$(base64 -w0 "$report")"
          } >> "$GITHUB_OUTPUT"

  # Checks out and executes nothing: it turns the report into one tracking
  # issue labelled `edge-main-drift` with the repository's own GITHUB_TOKEN,
  # for a run of the default branch only. It runs whenever the check job ran,
  # so a check that could not run is filed as `error`; only a clean run
  # closes it.
  edge-main-drift-issue:
    name: Edge main drift issue
    needs: edge-main-drift
    if: >-
      !cancelled() && needs.edge-main-drift.result != 'cancelled' && needs.edge-main-drift.result != 'skipped' &&
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open, update or close the Edge main tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RESULT: ${{ needs.edge-main-drift.result }}
          OUTCOME: ${{ needs.edge-main-drift.outputs.outcome }}
          EDGE_COMMIT: ${{ needs.edge-main-drift.outputs.edge-commit }}
          REPORT: ${{ needs.edge-main-drift.outputs.report }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          label=edge-main-drift
          marker='<!-- edge-main-drift -->'
          title="Edge main drift: GitForgeOps fails its checks against Ferrum Edge main"
          report="$RUNNER_TEMP/report.md"
          case "$OUTCOME" in
            clean | drift | error) base64 -d <<< "$REPORT" > "$report" ;;
            *)
              # The check job stopped before its report step (a timeout, a
              # runner loss): nothing was compared, and that is a finding too.
              OUTCOME=error
              {
                echo "$marker"
                echo "The Edge main drift check did not finish (check job: \`$CHECK_RESULT\`), so it compared nothing against Ferrum Edge \`main\` this run. A clean scheduled run closes this issue."
                echo
                echo "Run: $run_url"
              } > "$report"
              ;;
          esac
          # Only an issue this workflow wrote (its body starts with the marker)
          # is edited or closed; a human-labelled issue is left alone.
          number=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&labels=$label&per_page=100" \
            --jq '.[] | select(.pull_request == null and ((.body // "") | startswith("<!-- edge-main-drift -->"))) | .number' \
            | sort -n | sed -n 1p)
          case "$OUTCOME" in
            drift | error)
              if [ "$OUTCOME" = drift ]; then
                note="Still failing against Ferrum Edge main at \`${EDGE_COMMIT:0:12}\`: $run_url"
                summary="GitForgeOps fails checks against Ferrum Edge main at ${EDGE_COMMIT:-an unknown commit}"
              else
                note="The Edge main drift check could not run: $run_url"
                summary="The Edge main drift check could not run"
              fi
              gh label create "$label" --repo "$GITHUB_REPOSITORY" --color B60205 \
                --description "Fails its checks against unreleased Ferrum Edge main" --force
              if [ -n "$number" ]; then
                gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$report"
                gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$note"
                echo "::notice::Updated tracking issue #$number."
              else
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label "$label" \
                  --body-file "$report"
                echo "::notice::Opened a tracking issue."
              fi
              echo "::error::$summary; see the tracking issue."
              exit 1
              ;;
            clean)
              if [ -n "$number" ]; then
                gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
                  --comment "Clean against Ferrum Edge main at \`${EDGE_COMMIT:0:12}\`: $run_url"
                echo "::notice::Closed tracking issue #$number."
              fi
              ;;
          esac
