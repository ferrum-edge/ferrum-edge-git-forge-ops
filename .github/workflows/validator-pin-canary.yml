name: GitForgeOps Validator Pin Canary

# Upstream ferrum-edge publishes production artifacts only for version tags.
# Assets on a given tag are immutable; a new version tag is a new candidate.
# Every workflow installs exactly the release release/baseline.json pins, so a
# new upstream release never breaks validation by itself. This canary checks
# daily that the pinned build still installs (publisher checksum, baseline
# digest and reviewed allowlist agree) and accepts resource labels, and it
# reports when Ferrum Edge has published a newer release than the pin, handing
# a maintainer the exact reviewed allowlist line for it. Moving the pin is a
# reviewed change to the allowlist and release/baseline.json together.
#
# The forward-looking half of the same pairing check (ferrum-contracts#76),
# against the gateway Edge `main` would ship next, is edge-main-drift.yml.
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validator-pin-canary
  cancel-in-progress: false

jobs:
  validator-pin-canary:
    runs-on: ubuntu-26.04
    # Install and label probe, plus at most two bounded candidate-line
    # computations (each capped below) and the issue update.
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      ISSUE_TITLE: Refresh the pinned ferrum-edge validator digest
      ISSUE_MARKER: '<!-- gitforgeops:validator-pin-canary -->'
    steps:
      - name: Require protected default branch
        env:
          SOURCE_REF: ${{ github.ref }}
          EXPECTED_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          [ "$SOURCE_REF" = "$EXPECTED_REF" ] || {
            echo "::error::The validator pin canary may run only from $EXPECTED_REF."
            exit 1
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify the reviewed validator digest
        id: install
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          status=0
          bash .github/scripts/install-ferrum-edge.sh \
            "$RUNNER_TEMP/validator-canary/ferrum-edge" || status=$?
          echo "status=$status" >>"$GITHUB_OUTPUT"

      # Keep the downloaded executable out of the token-bearing install process
      # tree: env -i protects only its direct environment, not Linux /proc.
      - name: Verify resource-label support without a GitHub token
        id: verify
        if: steps.install.outputs.status == '0'
        run: |
          set -uo pipefail
          status=0
          bash .github/scripts/check-validator-resource-labels.sh \
            "$RUNNER_TEMP/validator-canary/ferrum-edge" || status=$?
          echo "status=$status" >>"$GITHUB_OUTPUT"

      - name: Compute the pinned allowlist line
        id: refresh
        if: steps.install.outputs.status != '0'
        timeout-minutes: 7
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          line=$(timeout 360 bash .github/scripts/refresh-ferrum-edge-pin.sh)
          {
            echo 'line<<CANARY_EOF'
            printf '%s\n' "$line"
            echo 'CANARY_EOF'
          } >>"$GITHUB_OUTPUT"

      # Informational: a newer upstream release is reported, never installed.
      # Every network call here is bounded. A lookup that fails or times out is
      # "unknown": reported, never failing, and it leaves the tracking issue as
      # it is. The pinned-build verification above stays strict.
      - name: Check for a newer upstream release
        id: newer
        if: ${{ !cancelled() }}
        timeout-minutes: 9
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # `--newer` compares versions numerically against the baseline,
          # across every page of the release list, and prints the highest
          # published release only when it is greater.
          pinned=$(jq -er '.validator.version' release/baseline.json) || pinned=
          if ! newest=$(timeout 120 bash .github/scripts/refresh-ferrum-edge-pin.sh --newer) || [ -z "$pinned" ]; then
            echo "lookup=unknown" >>"$GITHUB_OUTPUT"
            echo "tag=" >>"$GITHUB_OUTPUT"
            echo "::warning::Unknown: the newest published Ferrum Edge release could not be compared with the pin."
            echo "Newer Ferrum Edge release: unknown (lookup failed or timed out)." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "lookup=ok" >>"$GITHUB_OUTPUT"
          echo "pinned=$pinned" >>"$GITHUB_OUTPUT"
          if [ -z "$newest" ]; then
            echo "tag=" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$newest" >>"$GITHUB_OUTPUT"
          echo "::warning::Ferrum Edge $newest is published; release/baseline.json pins $pinned."
          # The tag is already recorded above; a slow or failed digest fetch
          # only leaves the candidate line empty.
          line=$(timeout 360 bash .github/scripts/refresh-ferrum-edge-pin.sh --release "$newest") || line=
          {
            echo 'line<<CANARY_EOF'
            printf '%s\n' "$line"
            echo 'CANARY_EOF'
          } >>"$GITHUB_OUTPUT"

      # `!cancelled()`: without a status function the condition is implicitly
      # `success() && ...`, so a failed refresh after a failed install would
      # skip this step exactly when the pairing is broken.
      - name: Open or update the tracking issue
        if: ${{ !cancelled() && (steps.install.outputs.status != '0' || steps.verify.outputs.status != '0' || steps.newer.outputs.tag != '') }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          INSTALL_STATUS: ${{ steps.install.outputs.status }}
          VERIFY_STATUS: ${{ steps.verify.outputs.status }}
          ALLOWLIST_LINE: ${{ steps.refresh.outputs.line }}
          PINNED_TAG: ${{ steps.newer.outputs.pinned }}
          NEWER_TAG: ${{ steps.newer.outputs.tag }}
          NEWER_LINE: ${{ steps.newer.outputs.line }}
        run: |
          set -euo pipefail
          {
            printf '%s\n\n' "$ISSUE_MARKER"
            if [ "$INSTALL_STATUS" != '0' ] || [ "$VERIFY_STATUS" != '0' ]; then
              cat <<EOF
          ## The pinned validator pairing failed

          Either the build release/baseline.json pins no longer installs (the
          publisher checksum, the baseline digest and the reviewed
          \`.github/ferrum-edge-checksums.txt\` allowlist must all agree), or
          the verified binary rejected the minimal fixture with labels on all
          four gateway resource kinds. Every workflow that runs
          \`ferrum-edge validate\` fails until this is fixed. See the canary
          log for the original diagnostic. Git Forge Ops always emits resource
          labels and requires a build including ferrum-edge#5483.

          When the pinned digest is missing from the allowlist, the line below
          is computed from the publisher checksum and checked against the
          baseline digest. Review the upstream build before appending it:

          \`\`\`
          $ALLOWLIST_LINE
          \`\`\`

          If no line is shown, either installation succeeded but label
          validation failed, or computing the line failed too (see the canary
          log). Do not re-approve the same incompatible build. Regenerate the
          line with:

          \`\`\`bash
          bash .github/scripts/refresh-ferrum-edge-pin.sh --append
          \`\`\`

          EOF
            fi
            if [ -n "$NEWER_TAG" ]; then
              cat <<EOF
          ## A newer Ferrum Edge release is published

          Ferrum Edge $NEWER_TAG is published; release/baseline.json pins
          $PINNED_TAG, and every workflow keeps installing exactly the pinned
          build. Adopting the new release is a reviewed change: append its
          allowlist line, move \`validator\` and \`tested_gateway\` in
          release/baseline.json, the Dockerfile gateway stage and the paired
          contracts together, and qualify the new pairing. Candidate allowlist
          line, computed from the publisher checksum (empty when that failed):

          \`\`\`
          $NEWER_LINE
          \`\`\`

          Regenerate it with:

          \`\`\`bash
          bash .github/scripts/refresh-ferrum-edge-pin.sh --release $NEWER_TAG --append
          \`\`\`

          EOF
            fi
            echo "Keep previous approved digests. The PR's required static-validation"
            echo 'check must also accept the labeled fixture before a new pairing'
            echo 'can merge; an allowlist entry alone does not prove compatibility.'
            echo
            echo "Canary run: $RUN_URL"
          } >issue-body.md

          number=$(gh api --paginate "repos/$REPO/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null) | [.number, .title] | @tsv' \
            | awk -F'\t' -v title="$ISSUE_TITLE" '$2 == title { print $1; exit }')

          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$REPO" --body-file issue-body.md
            echo "::notice::Updated tracking issue #$number."
          else
            gh issue create --repo "$REPO" --title "$ISSUE_TITLE" --body-file issue-body.md
            echo "::notice::Opened a tracking issue for the validator pin."
          fi

      - name: Close a resolved tracking issue
        if: steps.install.outputs.status == '0' && steps.verify.outputs.status == '0' && steps.newer.outputs.lookup == 'ok' && steps.newer.outputs.tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          number=$(gh api --paginate "repos/$REPO/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null) | [.number, .title] | @tsv' \
            | awk -F'\t' -v title="$ISSUE_TITLE" '$2 == title { print $1; exit }')
          if [ -n "$number" ]; then
            gh issue close "$number" --repo "$REPO" \
              --comment 'The pinned validator installs, accepts resource labels on all four gateway resource kinds, and is the newest published Ferrum Edge release.'
            echo "::notice::Closed resolved tracking issue #$number."
          fi

      - name: Fail when the validator pairing is invalid
        if: ${{ !cancelled() && (steps.install.outputs.status != '0' || steps.verify.outputs.status != '0') }}
        run: |
          echo "::error::The pinned validator digest or resource-label compatibility check failed; see the tracking issue."
          exit 1
