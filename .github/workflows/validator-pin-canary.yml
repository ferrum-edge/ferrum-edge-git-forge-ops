name: GitForgeOps Validator Pin Canary

# Upstream ferrum-edge republishes its rolling `latest` release on every build,
# so the reviewed digest allowlist goes stale on upstream's schedule rather than
# ours. This canary notices that the same day instead of when the next pull
# request fails, and it hands a maintainer the exact reviewed line to commit.
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validator-pin-canary
  cancel-in-progress: false

jobs:
  validator-pin-canary:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    env:
      ISSUE_TITLE: Refresh the pinned ferrum-edge validator digest
      ISSUE_MARKER: '<!-- gitforgeops:validator-pin-canary -->'
    steps:
      - name: Require protected default branch
        env:
          SOURCE_REF: ${{ github.ref }}
          EXPECTED_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          [ "$SOURCE_REF" = "$EXPECTED_REF" ] || {
            echo "::error::The validator pin canary may run only from $EXPECTED_REF."
            exit 1
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify the reviewed validator digest and resource-label support
        id: verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          status=0
          bash .github/scripts/install-ferrum-edge.sh \
            "$RUNNER_TEMP/validator-canary/ferrum-edge" || status=$?
          echo "pin_status=$status" >>"$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then
            bash .github/scripts/check-validator-resource-labels.sh \
              "$RUNNER_TEMP/validator-canary/ferrum-edge" || status=$?
          fi
          echo "status=$status" >>"$GITHUB_OUTPUT"

      - name: Compute the current upstream allowlist line
        id: refresh
        if: steps.verify.outputs.pin_status != '0'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          line=$(bash .github/scripts/refresh-ferrum-edge-pin.sh)
          {
            echo 'line<<CANARY_EOF'
            printf '%s\n' "$line"
            echo 'CANARY_EOF'
          } >>"$GITHUB_OUTPUT"

      - name: Open or update the tracking issue
        if: steps.verify.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALLOWLIST_LINE: ${{ steps.refresh.outputs.line }}
        run: |
          set -euo pipefail
          cat >issue-body.md <<EOF
          $ISSUE_MARKER

          The validator pairing check failed: either the reviewed digest no
          longer covers the upstream build, or the verified binary rejected
          the minimal fixture with labels on all four gateway resource kinds.
          See the canary log for the original diagnostic. Git Forge Ops always
          emits resource labels and requires a build including ferrum-edge#5483.

          When the digest is stale, the candidate line below is computed from
          the publisher checksum. Review the upstream build before appending
          it to \`.github/ferrum-edge-checksums.txt\`:

          \`\`\`
          $ALLOWLIST_LINE
          \`\`\`

          If no line is shown, installation succeeded but label validation
          failed. Do not re-approve the same incompatible build; select an
          upstream build with resource-label support. Regenerate a candidate:

          \`\`\`bash
          bash .github/scripts/refresh-ferrum-edge-pin.sh --append
          \`\`\`

          Keep previous approved digests. The PR's required static-validation
          check must also accept the labeled fixture before the new pairing
          can merge; an allowlist entry alone does not prove compatibility.

          Canary run: $RUN_URL
          EOF

          number=$(gh api --paginate "repos/$REPO/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null) | [.number, .title] | @tsv' \
            | awk -F'\t' -v title="$ISSUE_TITLE" '$2 == title { print $1; exit }')

          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$REPO" --body-file issue-body.md
            echo "::notice::Updated tracking issue #$number."
          else
            gh issue create --repo "$REPO" --title "$ISSUE_TITLE" --body-file issue-body.md
            echo "::notice::Opened a tracking issue for the stale validator pin."
          fi

      - name: Close a resolved tracking issue
        if: steps.verify.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          number=$(gh api --paginate "repos/$REPO/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null) | [.number, .title] | @tsv' \
            | awk -F'\t' -v title="$ISSUE_TITLE" '$2 == title { print $1; exit }')
          if [ -n "$number" ]; then
            gh issue close "$number" --repo "$REPO" \
              --comment 'The reviewed digest resolves and the verified validator accepts resource labels on all four gateway resource kinds.'
            echo "::notice::Closed resolved tracking issue #$number."
          fi

      - name: Fail when the validator pairing is invalid
        if: steps.verify.outputs.status != '0'
        run: |
          echo "::error::The reviewed validator digest or resource-label compatibility check failed; see the tracking issue."
          exit 1
