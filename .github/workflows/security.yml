name: Security
# A job that supplies a required check in an `edited`-triggered workflow must
# not use a job-level `if` that skips edited events; the newest skipped run can
# fail the release gate.

on:
  # Report required security contexts on every PR. Path filtering a required
  # workflow leaves non-matching PRs stuck waiting for a status that never ran.
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'examples/**'
      - '.cargo/**'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'build.rs'
      - 'rust-toolchain.toml'
      - 'rust-toolchain'
      - 'Dockerfile'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/scripts/**'
      - '.github/dependabot.yml'
      - '.github/cargo-audit-policy.json'
      - '.github/ferrum-edge-checksums.txt'
      - '.github/CODEOWNERS'
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

jobs:
  security-supply-chain-policy:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check out trusted supply-chain policy
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted-supply-chain
          persist-credentials: false

      - name: Check immutable workflow and container references
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            CANDIDATE_CHECKER=.github/scripts/check_supply_chain.py
            if [ ! -f "$CANDIDATE_CHECKER" ] || [ -L "$CANDIDATE_CHECKER" ]; then
              echo "Candidate must retain the regular-file supply-chain checker." >&2
              exit 1
            fi
            # Execute policy code from the protected default branch while
            # pointing it at the candidate tree. The global assignments keep
            # the runner compatible with a pre-`--root` checker.
            #
            # `-I` (isolated mode) is load-bearing. The working directory is
            # the candidate checkout, and a plain `python3 -` puts it first on
            # the import path, so a candidate root module named after anything
            # this runner or the checker imports would run before the trusted
            # policy and could exit green. Isolated mode also ignores every
            # interpreter environment variable and the user site directory.
            #
            # There is no fallback. The one-time pinned bootstrap existed only
            # while `main` did not yet carry this checker; once it does, a
            # fallback can only run an older policy against a newer tree.
            CHECKER=trusted-supply-chain/.github/scripts/check_supply_chain.py
            [ -f "$CHECKER" ] || { echo "Trusted supply-chain checker is unavailable." >&2; exit 1; }
            python3 -I - "$CHECKER" "$GITHUB_WORKSPACE" <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          checker = Path(sys.argv[1]).resolve()
          candidate = Path(sys.argv[2]).resolve()
          spec = importlib.util.spec_from_file_location("trusted_supply_chain", checker)
          if spec is None or spec.loader is None:
              raise SystemExit("could not load trusted supply-chain checker")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.ROOT = candidate
          module.WORKFLOWS = candidate / ".github" / "workflows"
          module.ACTION_FILES = sorted(
              {
                  *module.WORKFLOWS.glob("*.yml"),
                  *module.WORKFLOWS.glob("*.yaml"),
                  *(candidate / ".github" / "actions").glob("**/action.yml"),
                  *(candidate / ".github" / "actions").glob("**/action.yaml"),
              }
          )
          sys.argv = [str(checker)]
          raise SystemExit(module.main())
          PY
          else
            python3 -I .github/scripts/check_supply_chain.py
          fi

      - name: Test privileged-input boundary
        run: python3 -I -m unittest discover -s .github/scripts/tests -v

  security-cargo-audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check out trusted cargo-audit policy
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted-cargo-audit
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action; Rust 1.99.1
        with:
          toolchain: 1.99.1

      # Always install from the pinned action's checksum manifest. Do not
      # restore the former cargo-audit cache: it included ~/.cargo/bin.
      - name: Install cargo-audit
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-audit@0.22.1
          checksum: true
          fallback: none

      - name: Test audit policy gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            python3 -I trusted-cargo-audit/.github/scripts/tests/test_check_cargo_audit.py
          else
            python3 -I .github/scripts/tests/test_check_cargo_audit.py
          fi

      - name: Enforce cargo audit policy
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            python3 -I trusted-cargo-audit/.github/scripts/check_cargo_audit.py \
              --policy trusted-cargo-audit/.github/cargo-audit-policy.json \
              --source-root "$GITHUB_WORKSPACE"
          else
            python3 -I .github/scripts/check_cargo_audit.py
          fi
