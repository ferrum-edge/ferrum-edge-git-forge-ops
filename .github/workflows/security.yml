name: Security

on:
  # Report required security contexts on every PR. Path filtering a required
  # workflow leaves non-matching PRs stuck waiting for a status that never ran.
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'examples/**'
      - '.cargo/**'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'build.rs'
      - 'rust-toolchain.toml'
      - 'rust-toolchain'
      - 'Dockerfile'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '.github/dependabot.yml'
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  security-supply-chain-policy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check out trusted supply-chain policy
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted-supply-chain
          persist-credentials: false

      - name: Check out immutable policy bootstrap
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # PR #87 adds the checker itself, so its protected base cannot supply
          # it. This already-reviewed commit of the same PR is a one-time
          # immutable fallback; after merge the default-branch copy always wins.
          #
          # Re-pin this whenever the policy changes while `main` still lacks the
          # checker: the fallback runs the OLD policy against the NEW tree, so
          # it must stay at or after the commit that last reshaped the policy
          # (validator digest allowlist, `state-guard.yml` on
          # `pull_request_target`, ...) or it rejects the very tree it guards.
          # `test_immutable_bootstrap_checker_accepts_the_current_policy` is
          # what catches a stale pin.
          ref: 521cca0fdd75dde4c113031ff8a1d0f941779d2e
          path: bootstrap-supply-chain
          persist-credentials: false

      - name: Check immutable workflow and container references
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            CANDIDATE_CHECKER=.github/scripts/check_supply_chain.py
            if [ ! -f "$CANDIDATE_CHECKER" ] || [ -L "$CANDIDATE_CHECKER" ]; then
              echo "Candidate must retain the regular-file supply-chain checker." >&2
              exit 1
            fi
            # Execute policy code from the protected default branch while
            # pointing it at the candidate tree. The global assignments keep
            # the first bootstrap compatible with the pre-`--root` checker.
            CHECKER=trusted-supply-chain/.github/scripts/check_supply_chain.py
            if [ ! -f "$CHECKER" ]; then
              CHECKER=bootstrap-supply-chain/.github/scripts/check_supply_chain.py
            fi
            [ -f "$CHECKER" ] || { echo "Trusted supply-chain checker is unavailable." >&2; exit 1; }
            python3 - "$CHECKER" "$GITHUB_WORKSPACE" <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          checker = Path(sys.argv[1]).resolve()
          candidate = Path(sys.argv[2]).resolve()
          spec = importlib.util.spec_from_file_location("trusted_supply_chain", checker)
          if spec is None or spec.loader is None:
              raise SystemExit("could not load trusted supply-chain checker")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.ROOT = candidate
          module.WORKFLOWS = candidate / ".github" / "workflows"
          module.ACTION_FILES = sorted(
              {
                  *module.WORKFLOWS.glob("*.yml"),
                  *module.WORKFLOWS.glob("*.yaml"),
                  *(candidate / ".github" / "actions").glob("**/action.yml"),
                  *(candidate / ".github" / "actions").glob("**/action.yaml"),
              }
          )
          sys.argv = [str(checker)]
          raise SystemExit(module.main())
          PY
          else
            python3 .github/scripts/check_supply_chain.py
          fi

      - name: Test privileged-input boundary
        run: python3 -m unittest discover -s .github/scripts/tests -v

  security-cargo-audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CARGO_AUDIT_VERSION: 0.22.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action; Rust 1.98.0
        with:
          toolchain: 1.98.0

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-audit-${{ env.CARGO_AUDIT_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-audit-${{ env.CARGO_AUDIT_VERSION }}-
            ${{ runner.os }}-cargo-audit-

      - name: Install cargo-audit
        run: |
          if ! cargo audit --version | grep -q "$CARGO_AUDIT_VERSION"; then
            cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked --force
          fi
          cargo audit --version

      - name: cargo audit
        run: |
          # RUSTSEC-2023-0071 is an unfixed transitive rsa advisory. Keep
          # auditing everything else while upstream works through a fixed
          # release path for the direct dependencies that currently pull rsa in.
          cargo audit --ignore RUSTSEC-2023-0071

  codeql:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: rust

      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4

  trivy-image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build image for scan
        run: docker build -t gitforgeops:scan .

      - name: Smoke-test minimal runtime
        run: |
          docker run --rm gitforgeops:scan --help >/dev/null
          docker run --rm --entrypoint ferrum-edge gitforgeops:scan --help >/dev/null
          for package in apt libapt-pkg7.0 libssl3t64 openssl-provider-legacy; do
            status=$(docker run --rm --entrypoint dpkg-query gitforgeops:scan \
              -W -f='${db:Status-Abbrev}' "$package" 2>/dev/null || true)
            if [[ "$status" == ii* ]]; then
              echo "Purged runtime package remains installed: $package" >&2
              exit 1
            fi
          done

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gitforgeops:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: trivy-results.sarif
