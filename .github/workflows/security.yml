name: Security
# A job that supplies a required check in an `edited`-triggered workflow must
# not use a job-level `if` that skips edited events; the newest skipped run can
# fail the release gate.

on:
  # Report required security contexts on every PR. Path filtering a required
  # workflow leaves non-matching PRs stuck waiting for a status that never ran.
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'examples/**'
      - '.cargo/**'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'build.rs'
      - 'rust-toolchain.toml'
      - 'rust-toolchain'
      - 'Dockerfile'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/scripts/**'
      - '.github/dependabot.yml'
      - '.github/cargo-audit-policy.json'
      - '.github/ferrum-edge-checksums.txt'
      - '.github/CODEOWNERS'
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

jobs:
  # The workflow-script unit tests and the tree's own supply-chain checker.
  # Not a required context: the supply-chain verdict on a pull request is
  # `trusted-supply-chain-policy` (supply-chain-policy.yml), which runs the
  # protected branch's checker against the candidate.
  security-workflow-scripts:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check immutable workflow and container references
        run: python3 -I .github/scripts/check_supply_chain.py

      - name: Test privileged-input boundary
        run: python3 -I -m unittest discover -s .github/scripts/tests -v

  security-cargo-audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check out trusted cargo-audit policy
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted-cargo-audit
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action; Rust 1.99.1
        with:
          toolchain: 1.99.1

      # Always install from the pinned action's checksum manifest. Do not
      # restore the former cargo-audit cache: it included ~/.cargo/bin.
      - name: Install cargo-audit
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-audit@0.22.1
          checksum: true
          fallback: none

      - name: Test audit policy gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            python3 -I trusted-cargo-audit/.github/scripts/tests/test_check_cargo_audit.py
          else
            python3 -I .github/scripts/tests/test_check_cargo_audit.py
          fi

      - name: Enforce cargo audit policy
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            python3 -I trusted-cargo-audit/.github/scripts/check_cargo_audit.py \
              --policy trusted-cargo-audit/.github/cargo-audit-policy.json \
              --source-root "$GITHUB_WORKSPACE"
          else
            python3 -I .github/scripts/check_cargo_audit.py
          fi
