name: GitForgeOps Drift Check

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Require protected default branch
        env:
          SOURCE_REF: ${{ github.ref }}
          EXPECTED_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          [ "$SOURCE_REF" = "$EXPECTED_REF" ] || {
            echo "::error::Drift checks may run only from $EXPECTED_REF."
            exit 1
          }

  list-envs:
    needs: preflight
    runs-on: ubuntu-24.04
    outputs:
      envs: ${{ steps.list.outputs.envs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action; Rust 1.98.0
        with:
          toolchain: 1.98.0

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build gitforgeops
        run: cargo install --path . --locked

      - name: Enumerate environments
        id: list
        run: |
          set -euo pipefail
          [[ -f .gitforgeops/config.yaml ]] || {
            echo "::error::Repository configuration is required before binding a deployment environment."
            exit 1
          }
          envs=$(gitforgeops envs --format json | jq -c .)
          jq -e '
            type == "array" and
            all(.[]; type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$"))
          ' <<< "$envs" >/dev/null || {
            echo "::error::Every environment must be a single safe path component."
            exit 1
          }
          echo "envs=$envs" >> "$GITHUB_OUTPUT"

  drift:
    needs: list-envs
    if: |
      needs.list-envs.outputs.envs != '[]'
      && needs.list-envs.outputs.envs != ''
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.list-envs.outputs.envs) }}
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate deployment routing
        id: deployment-mode
        env:
          RAW_MODE: ${{ vars.FERRUM_GATEWAY_MODE }}
        run: |
          set -euo pipefail
          mode=$(printf '%s' "${RAW_MODE:-api}" | tr '[:upper:]' '[:lower:]' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          [ -n "$mode" ] || mode=api
          case "$mode" in
            api|file) ;;
            *)
              echo "::error::Invalid FERRUM_GATEWAY_MODE '$RAW_MODE'; expected api or file."
              exit 1
              ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" = file ]; then
            echo "File mode has no live Admin API drift surface; skipping this environment."
          fi

      - name: Download ferrum-edge binary
        if: steps.deployment-mode.outputs.mode == 'api'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/install-ferrum-edge.sh

      - name: Install Rust toolchain
        if: steps.deployment-mode.outputs.mode == 'api'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action; Rust 1.98.0
        with:
          toolchain: 1.98.0

      - name: Cache cargo registry
        if: steps.deployment-mode.outputs.mode == 'api'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install gitforgeops
        if: steps.deployment-mode.outputs.mode == 'api'
        run: cargo install --path . --locked

      - name: Load credential bundles
        if: steps.deployment-mode.outputs.mode == 'api'
        # Every credential-bundle secret is bound by name — never the whole
        # `secrets` context. The shard list is capped by MAX_BUNDLE_SHARDS in
        # src/secrets/bundle.rs and .github/scripts/credential_bundles.py; see
        # apply-on-merge.yml for the full rationale.
        env:
          FERRUM_CREDS_BUNDLE: ${{ secrets.FERRUM_CREDS_BUNDLE }}
          FERRUM_CREDS_BUNDLE_1: ${{ secrets.FERRUM_CREDS_BUNDLE_1 }}
          FERRUM_CREDS_BUNDLE_2: ${{ secrets.FERRUM_CREDS_BUNDLE_2 }}
