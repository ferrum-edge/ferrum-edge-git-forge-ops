name: GitForgeOps Drift Check

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# Monitoring reads. It never mutates a gateway, never writes the ownership
# ledger, and never touches a credential bundle secret — `check_supply_chain.py`
# enforces all three by rejecting the corresponding secret bindings and any
# `gitforgeops` subcommand other than `diff` in this file.
permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Require protected default branch
        env:
          SOURCE_REF: ${{ github.ref }}
          EXPECTED_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          [ "$SOURCE_REF" = "$EXPECTED_REF" ] || {
            echo "::error::Drift checks may run only from $EXPECTED_REF."
            exit 1
          }

  list-envs:
    needs: preflight
    runs-on: ubuntu-24.04
    outputs:
      scopes: ${{ steps.list.outputs.scopes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action; Rust 1.98.0
        with:
          toolchain: 1.98.0

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build gitforgeops
        run: cargo install --path . --locked

      # The matrix carries the environment to compare AND the GitHub
      # Environment to bind for it. They are the same name unless the
      # environment set `monitoring.unattended: true`, in which case the binary
      # derives `<env>-monitor` — the environment that holds gateway *read*
      # credentials and requires no reviewer, so a nightly run is not parked
      # waiting for a human. See docs/github-launch-controls.md §3.
      - name: Enumerate environments
        id: list
        run: |
          set -euo pipefail
          [[ -f .gitforgeops/config.yaml ]] || {
            echo "::error::Repository configuration is required before binding a deployment environment."
            exit 1
          }
          scopes=$(gitforgeops envs --format json --include-scopes | jq -c '
            [ .[] | {
                environment,
                monitoring_environment,
                unattended_monitoring
              } ]
          ')
          jq -e '
            type == "array" and
            all(.[]; .environment as $e | .monitoring_environment as $m |
              ($e | type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$")) and
              ($m | type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$")))
          ' <<< "$scopes" >/dev/null || {
            echo "::error::Every environment must be a single safe path component."
            exit 1
          }
          echo "scopes=$scopes" >> "$GITHUB_OUTPUT"

  drift:
    needs: list-envs
    if: |
      needs.list-envs.outputs.scopes != '[]'
      && needs.list-envs.outputs.scopes != ''
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scope: ${{ fromJson(needs.list-envs.outputs.scopes) }}
    environment: ${{ matrix.scope.monitoring_environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate deployment routing
        id: deployment-mode
        env:
          RAW_MODE: ${{ vars.FERRUM_GATEWAY_MODE }}
        run: |
          set -euo pipefail
          mode=$(printf '%s' "${RAW_MODE:-api}" | tr '[:upper:]' '[:lower:]' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          [ -n "$mode" ] || mode=api
          case "$mode" in
            api|file) ;;
            *)
              echo "::error::Invalid FERRUM_GATEWAY_MODE '$RAW_MODE'; expected api or file."
              exit 1
              ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" = file ]; then
            echo "File mode has no live Admin API drift surface; skipping this environment."
          fi

      - name: Download ferrum-edge binary
        if: steps.deployment-mode.outputs.mode == 'api'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/install-ferrum-edge.sh

      - name: Install Rust toolchain
        if: steps.deployment-mode.outputs.mode == 'api'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action; Rust 1.98.0
        with:
          toolchain: 1.98.0

      - name: Cache cargo registry
        if: steps.deployment-mode.outputs.mode == 'api'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install gitforgeops
        if: steps.deployment-mode.outputs.mode == 'api'
        run: cargo install --path . --locked

      # Deliberately NO credential-bundle secrets. A comparison does not need
      # them: `diff` excludes still-unresolved broker leaves from the live
      # comparison per leaf, so an unbrokered gateway document is compared in
      # full and the credential values themselves are simply out of scope.
      # Handing an unattended monitoring environment the whole credential
      # bundle would be the opposite of "only the secret material necessary for
      # comparison", so the bundle stays where allocation needs it: the
      # approval-gated apply and rotate workflows.
      - name: Check drift
        # `gitforgeops diff --exit-on-drift`: 0 in sync, 2 drift, 1 the check
        # itself failed (unreachable gateway, 401, cached/non-authoritative
        # backup, bad configuration). The exit code is captured rather than
        # allowed to fail the step, because the three cases mean three
        # different things and only one of them is a statement about the
        # gateway. `drift_report.py` does that classification; the aggregate
        # job below decides the workflow's status.
        id: check
        if: steps.deployment-mode.outputs.mode == 'api'
        env:
          FERRUM_ENV: ${{ matrix.scope.environment }}
          FERRUM_GATEWAY_MODE: ${{ steps.deployment-mode.outputs.mode }}
          FERRUM_GATEWAY_URL: ${{ secrets.FERRUM_GATEWAY_URL }}
          FERRUM_ADMIN_JWT_SECRET: ${{ secrets.FERRUM_ADMIN_JWT_SECRET }}
          # Optional JWT claim settings; see apply-on-merge.yml for why they
          # are bound explicitly and why blank means "unset", not "empty".
          # `GET /backup` is admin-only today, so a monitoring environment's
          # token is admin-role and its signing secret is write-equivalent at
          # the gateway; see docs/github-launch-controls.md §3.1.
          FERRUM_ADMIN_JWT_ISSUER: ${{ secrets.FERRUM_ADMIN_JWT_ISSUER }}
          FERRUM_ADMIN_JWT_ROLE: ${{ secrets.FERRUM_ADMIN_JWT_ROLE }}
          FERRUM_ADMIN_JWT_AUDIENCE: ${{ secrets.FERRUM_ADMIN_JWT_AUDIENCE }}
          FERRUM_ADMIN_JWT_TTL_SECS: ${{ secrets.FERRUM_ADMIN_JWT_TTL_SECS }}
          FERRUM_GATEWAY_CA_CERT: ${{ secrets.FERRUM_GATEWAY_CA_CERT }}
          FERRUM_GATEWAY_CLIENT_CERT: ${{ secrets.FERRUM_GATEWAY_CLIENT_CERT }}
          FERRUM_GATEWAY_CLIENT_KEY: ${{ secrets.FERRUM_GATEWAY_CLIENT_KEY }}
        run: |
          set -uo pipefail
          status=0
          gitforgeops diff --exit-on-drift || status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Record outcome
        # `!cancelled()` and not `always()`: a cancelled job records nothing,
        # and the aggregate job below reads a missing record as `not_completed`
        # rather than as a clean check.
        if: ${{ !cancelled() }}
        env:
          ENVIRONMENT: ${{ matrix.scope.environment }}
          CHECK_ENVIRONMENT: ${{ matrix.scope.monitoring_environment }}
          UNATTENDED: ${{ matrix.scope.unattended_monitoring }}
          MODE: ${{ steps.deployment-mode.outputs.mode }}
          EXIT_CODE: ${{ steps.check.outputs.exit_code }}
        run: |
          set -euo pipefail
          mkdir -p drift-outcomes
          args=(record
            --environment "$ENVIRONMENT"
            --check-environment "$CHECK_ENVIRONMENT"
            --output "drift-outcomes/${ENVIRONMENT}.json")
          [ "$UNATTENDED" = "true" ] && args+=(--unattended)
          if [ "$MODE" = file ]; then
            args+=(--outcome skipped
              --detail "file mode has no live Admin API drift surface")
          elif [ -z "${EXIT_CODE:-}" ]; then
            args+=(--outcome failed
              --detail "the comparison step produced no exit code")
          else
            args+=(--exit-code "$EXIT_CODE")
          fi
          python3 .github/scripts/drift_report.py "${args[@]}"

      - name: Publish outcome
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: drift-outcome-${{ matrix.scope.environment }}
          path: drift-outcomes/
          retention-days: 30

  # One stable status for the whole check. Its last successful run is the
  # "last successful check" evidence — `audit_settings.py` reads it through the
  # Actions API and fails when monitoring has silently stopped, which is how a
  # cron entry alone is prevented from passing for coverage. (GitHub disables
  # scheduled workflows in repositories that go 60 days without activity, so
  # "the cron is still in the file" proves nothing.)
  report:
    needs: [list-envs, drift]
    if: ${{ !cancelled() && needs.list-envs.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Collect outcomes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: drift-outcome-*
          path: drift-outcomes
          merge-multiple: true

      # A matrix entry that never produced a record did not report "in sync";
      # it did not report at all. Reconstruct those as `not_completed` so an
      # environment held at "waiting for approval" is visible as an incomplete
      # check rather than absent from the table.
      - name: Reconstruct missing outcomes
        env:
          SCOPES: ${{ needs.list-envs.outputs.scopes }}
        run: |
          set -euo pipefail
          mkdir -p drift-outcomes
          while read -r environment check_environment unattended; do
            [ -n "$environment" ] || continue
            [ -f "drift-outcomes/${environment}.json" ] && continue
            args=(record
              --environment "$environment"
              --check-environment "$check_environment"
              --outcome not_completed
              --detail "the drift job produced no outcome for this environment"
              --output "drift-outcomes/${environment}.json")
            [ "$unattended" = "true" ] && args+=(--unattended)
            python3 .github/scripts/drift_report.py "${args[@]}"
          done < <(jq -r '.[] | [.environment, .monitoring_environment, (.unattended_monitoring|tostring)] | @tsv' <<< "$SCOPES")

      - name: Summarize monitoring coverage
        run: |
          python3 .github/scripts/drift_report.py summarize \
            --input drift-outcomes \
            --summary "$GITHUB_STEP_SUMMARY"
