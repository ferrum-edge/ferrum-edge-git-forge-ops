name: GitForgeOps Lifecycle Acceptance

# The suite that runs the product rather than its unit tests: a real gateway,
# a real upstream, the real binary, real traffic. Its sealed result is what
# `release.yml` refuses to publish without.
#
# Not a required per-PR check, deliberately. It needs a gateway build the
# installer can fetch, and turning every pull request red when that is
# unavailable would train people to override the gate rather than fix it. It
# runs on `main`, nightly, and on demand — and publication verifies a result
# exists for the exact revision being published, so an unrun suite blocks the
# release instead of blocking development.
on:
  push:
    branches: [main]
    paths-ignore:
      - '.state/**'
      - 'assembled/**'
  schedule:
    - cron: '0 3 * * *'
  # Dispatch on the revision you are releasing (a tag or `main`) with the
  # sealed result from tests/lifecycle/github_acceptance.md pasted into
  # `github_acceptance`. It is the only way the scenarios CI cannot run —
  # environment approvals, the state-writer App, protected-branch ledger writes
  # — reach the release gate, and it can only fill the scenarios this run
  # records as `skipped`.
  workflow_dispatch:
    inputs:
      github_acceptance:
        description: >-
          Sealed lifecycle-result.json from the GitHub acceptance path, as JSON.
          Fills only this run's skipped scenarios, attributed to you.
        required: false
        default: ''

# Reads only. The suite talks to a loopback gateway it starts itself, with
# credentials generated for the process and destroyed with it. It binds no
# GitHub Environment and holds no repository secret.
permissions:
  contents: read

concurrency:
  group: lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle-acceptance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action; Rust 1.98.0
        with:
          toolchain: 1.98.0

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install gitforgeops
        run: cargo install --path . --locked

      # The same binary, from the same allowlisted digests, that PR validation
      # already trusts. Reusing it means the suite certifies the gateway build
      # this repository has actually approved, and adds no second artifact to
      # pin.
      - name: Download ferrum-edge
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/install-ferrum-edge.sh

      # `!cancelled()` on the steps below, never `always()`: a cancelled run
      # must leave an UNSEALED record, which the release gate reads as "the
      # suite did not finish" rather than as a clean result.
      - name: Run the lifecycle suite
        id: lifecycle
        continue-on-error: true
        env:
          GITHUB_SHA: ${{ github.sha }}
          LIFECYCLE_RESULT: ${{ github.workspace }}/lifecycle-result.json
        run: bash tests/lifecycle/run.sh

      # The attestation arrives through the environment, never interpolated
      # into the script, and is merged only into scenarios this run skipped.
      # An unsealed attestation, or one sealed for another revision, another
      # gateway build, or outside the freshness window, fails the step — and
      # the job — rather than being dropped.
      - name: Merge the GitHub-repository attestation
        id: attest
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.github_acceptance != '' }}
        env:
          ATTESTATION: ${{ inputs.github_acceptance }}
          ATTESTED_BY: ${{ github.actor }}
        run: |
          set -euo pipefail
          attestation="${RUNNER_TEMP}/github-acceptance.json"
          printf '%s' "$ATTESTATION" > "$attestation"
          python3 .github/scripts/lifecycle_result.py attest \
            --result lifecycle-result.json \
            --attestation "$attestation" \
            --revision "$GITHUB_SHA" \
            --attested-by "$ATTESTED_BY"

      - name: Summarize
        if: ${{ !cancelled() }}
        run: |
          python3 .github/scripts/lifecycle_result.py verify \
            --result lifecycle-result.json \
            --revision "$GITHUB_SHA" \
            --summary "$GITHUB_STEP_SUMMARY" || true

      - name: Publish the acceptance result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lifecycle-result-${{ github.sha }}
          path: lifecycle-result.json
          retention-days: 90

      # Fail the job after the record exists. A run that stops before
      # publishing is indistinguishable from one that never started, and the
      # gate has to be able to tell those apart.
      - name: Fail on scenario failure
        if: steps.lifecycle.outcome == 'failure'
        run: |
          echo "::error::One or more lifecycle scenarios did not pass; see the job summary."
          exit 1
