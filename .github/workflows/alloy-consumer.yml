# A job that supplies a required check in an `edited`-triggered workflow must
# not use a job-level `if` that skips edited events; the newest skipped run can
# fail the release gate.
name: GitForgeOps Alloy Consumer Qualification

# Qualifies GitForgeOps against resource trees generated by the pinned Alloy
# producer. It builds an external repository with crates.io dependencies, so it
# is deliberately NOT a required check: it runs when the consumer surface
# changes, weekly, and on demand. Required static validation stays independent
# of Alloy and crates.io availability.
#
# This workflow executes pull request code, including Cargo build scripts. It
# therefore receives no GitHub Environment, secret or write-capable token; the
# validator installer's read-only token is scoped to its own step.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
    # Everything the consumer test exercises: the CLI load boundary, the
    # loader and validator hand-off, the checks the load boundary calls, and
    # the dependency and toolchain inputs that decide how trees are parsed.
    paths:
      - '.github/workflows/alloy-consumer.yml'
      - '.github/ferrum-edge-checksums.txt'
      - 'tests/fixtures/alloy-producer/**'
      - 'tests/unit/companion_schema_tests.rs'
      - 'tests/unit/mod.rs'
      - 'tests/unit_tests.rs'
      - 'src/main.rs'
      - 'src/cli.rs'
      - 'src/lib.rs'
      - 'src/error.rs'
      - 'src/diagnostics.rs'
      - 'src/config/**'
      - 'src/validate/**'
      - 'src/apply/**'
      - 'src/secrets/**'
      - 'build.rs'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alloy-consumer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  alloy-consumer-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The installer runs with GITHUB_TOKEN, so the script comes from the
      # protected default branch; the allowlist is the candidate's, as in
      # validate-pr.yml.
      - name: Check out trusted validator installer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted-validator
          persist-credentials: false

      - name: Download verified ferrum-edge validator
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash trusted-validator/.github/scripts/install-ferrum-edge.sh \
            "$RUNNER_TEMP/gitforgeops-validator-bin/ferrum-edge" \
            .github/ferrum-edge-checksums.txt

      # The full commit SHA is the producer pin; it must match PROVENANCE.json.
      - name: Check out pinned Alloy producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ferrum-edge/ferrum-alloy
          ref: 690aed7a9fa8458aeea4ac8416170c8daeb0470b
          path: alloy-producer
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action; Rust 1.99.0
        with:
          toolchain: 1.99.0

      # No cache is restored or published by the producer/consumer builds.
      - name: Generate Alloy GitForgeOps fixture trees
        run: |
          set -euo pipefail
          cargo +1.99.0 build --locked --manifest-path alloy-producer/Cargo.toml \
            -p ferrum-alloy-cli --bin ferrum-alloy --target-dir "$RUNNER_TEMP/alloy-producer-target"
          mkdir -p "$RUNNER_TEMP/alloy-generated"
          for fixture in orders-api plain-http; do
            "$RUNNER_TEMP/alloy-producer-target/debug/ferrum-alloy" edge export \
              --manifest "alloy-producer/contracts/fixtures/manifests/${fixture}.toml" \
              --format gitforgeops --output "$RUNNER_TEMP/alloy-generated/${fixture}"
          done

      - name: Require generated Alloy consumer qualification
        env:
          GITFORGEOPS_ALLOY_FIXTURE_ROOT: ${{ runner.temp }}/alloy-generated
          GITFORGEOPS_ALLOY_VALIDATOR: ${{ runner.temp }}/gitforgeops-validator-bin/ferrum-edge
        run: |
          set -euo pipefail
          # Edge validates the original orders fixture's TLS file contents.
          # Claim a new directory exclusively; never overwrite existing material.
          umask 077
          cleanup_tls() {
            sudo rm -f -- /etc/ferrum/edge-client.pem /etc/ferrum/edge-client.key \
              /etc/ferrum/alloy-ca.pem /etc/ferrum/alloy-ca.key /etc/ferrum/edge-client.csr
            sudo rmdir -- /etc/ferrum
          }
          sudo mkdir --mode=0700 /etc/ferrum
          trap cleanup_tls EXIT
          sudo chown "$(id -u):$(id -g)" /etc/ferrum
          openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
            -keyout /etc/ferrum/alloy-ca.key -out /etc/ferrum/alloy-ca.pem \
            -subj '/CN=alloy-ci-ca' -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'keyUsage=critical,keyCertSign,cRLSign' >/dev/null 2>&1
          openssl req -new -newkey rsa:2048 -nodes \
            -keyout /etc/ferrum/edge-client.key -out /etc/ferrum/edge-client.csr \
            -subj '/CN=alloy-ci-client' -addext 'basicConstraints=critical,CA:FALSE' \
            -addext 'keyUsage=critical,digitalSignature,keyEncipherment' \
            -addext 'extendedKeyUsage=clientAuth' >/dev/null 2>&1
          openssl x509 -req -in /etc/ferrum/edge-client.csr \
            -CA /etc/ferrum/alloy-ca.pem -CAkey /etc/ferrum/alloy-ca.key \
            -set_serial 2 -days 365 -copy_extensions copy \
            -out /etc/ferrum/edge-client.pem >/dev/null 2>&1
          chmod 0600 /etc/ferrum/alloy-ca.key /etc/ferrum/edge-client.key \
            /etc/ferrum/alloy-ca.pem /etc/ferrum/edge-client.pem /etc/ferrum/edge-client.csr
          openssl verify -CAfile /etc/ferrum/alloy-ca.pem -purpose sslclient \
            /etc/ferrum/edge-client.pem >/dev/null 2>&1
          # `cargo test` builds the gitforgeops binary the test invokes.
          test_name=unit::companion_schema_tests::alloy_generated_resources_load_assemble_and_validate
          listed=$(cargo test --locked --test unit_tests "$test_name" -- --ignored --exact --list --format terse)
          [ "$(grep -c ': test$' <<< "$listed")" -eq 1 ]
          grep -Fxq "$test_name: test" <<< "$listed"
          cargo test --locked --test unit_tests "$test_name" -- --ignored --exact --nocapture
