name: GitForgeOps Materialize File

# Produce a fully-resolved flat YAML (credentials inlined) and deliver it
# age-encrypted to the invoking admin's GitHub SSH key, as a short-retention
# workflow artifact. The plaintext file is never committed and never leaves
# the workflow runner unencrypted.
#
# Use this for file-mode gateways that consume a single assembled YAML at
# boot. The committed `assembled/<env>.yaml` in the repo is the placeholder
# version (safe for version control, no secrets). To get the real file, run
# this workflow.
#
# Gate who can run this via the GitHub Environment's protection rules
# (required reviewers, branch restrictions). Only users approved by those
# rules can trigger materialization.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (must match .gitforgeops/config.yaml)
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Require protected default branch
        env:
          SOURCE_REF: ${{ github.ref }}
          EXPECTED_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          [ "$SOURCE_REF" = "$EXPECTED_REF" ] || {
            echo "::error::Materialization may run only from $EXPECTED_REF."
            exit 1
          }

      - name: Require repository environment configuration
        run: |
          [[ -f .gitforgeops/config.yaml ]] || {
            echo "::error::Repository configuration is required before binding a deployment environment."
            exit 1
          }

  materialize:
    needs: preflight
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    concurrency:
      group: ferrum-materialize-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate environment input
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          [[ "$INPUT_ENVIRONMENT" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]] || {
            echo "::error::Environment must be a single safe path component."
            exit 1
          }

      - name: Validate file-mode routing
        id: deployment-mode
        env:
          RAW_MODE: ${{ vars.FERRUM_GATEWAY_MODE }}
        run: |
          set -euo pipefail
          mode=$(printf '%s' "${RAW_MODE:-api}" | tr '[:upper:]' '[:lower:]' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          [ -n "$mode" ] || mode=api
          if [ "$mode" != file ]; then
            echo "::error::Materialization requires FERRUM_GATEWAY_MODE=file; got '$RAW_MODE'."
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action; Rust 1.98.0
        with:
          toolchain: 1.98.0

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install gitforgeops
        run: cargo install --path . --locked

      - name: Require a configured environment
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          configured=$(gitforgeops envs --format json)
          jq -e --arg target "$INPUT_ENVIRONMENT" \
            'type == "array" and index($target) != null' <<< "$configured" >/dev/null || {
            echo "::error::Environment is not declared by the protected main configuration."
            exit 1
          }

      - name: Load credential bundles
        # File-path routing around OS env-block size limits. See
        # apply-on-merge.yml for the full rationale.
        run: |
          set -euo pipefail
          # Under $RUNNER_TEMP so the runner cleans it up; a bare `mktemp`
          # lands in a /tmp that self-hosted runners share between jobs.
          all_secrets=$(mktemp -p "${RUNNER_TEMP:-/tmp}")
          trap 'rm -f "$all_secrets"' EXIT
          cat > "$all_secrets" <<'SECRETS_EOF'
          ${{ toJSON(secrets) }}
          SECRETS_EOF
          creds_file="${RUNNER_TEMP:-/tmp}/ferrum-creds-${GITHUB_RUN_ID}-${GITHUB_JOB}-$$.json"
          python3 .github/scripts/credential_bundles.py "$all_secrets" "$creds_file"
          echo "FERRUM_CREDS_JSON_FILE=$creds_file" >> "$GITHUB_ENV"

      - name: Materialize and encrypt
        # Route inputs and actor through env vars. Interpolating
        # `${{ inputs.environment }}` or `${{ github.actor }}` directly into
        # the run block lets a crafted value break out of the quoted args
        # — especially dangerous here because the env secrets are loaded
        # in the previous step and a shell-escape could read them.
        env:
          FERRUM_ENV: ${{ inputs.environment }}
          FERRUM_GATEWAY_MODE: ${{ steps.deployment-mode.outputs.mode }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_ACTOR: ${{ github.actor }}
          # `export` also publishes the standalone {version, mesh} document
          # when the repo declares `kind: MeshConfig` fragments. It is a
          # separate artifact from the gateway file (`--output` names only the
          # gateway one) and carries no credential placeholders, so it is
          # written in the clear alongside the encrypted blob rather than
          # inside it. Kept under out/ so both land in the same upload.
          FERRUM_MESH_FILE_OUTPUT_PATH: out/assembled-${{ inputs.environment }}-mesh.yaml
        run: |
          set -euo pipefail
          mkdir -p out
          gitforgeops export --materialize \
            --encrypt-to "$INPUT_ACTOR" \
            --output "out/assembled-${INPUT_ENVIRONMENT}.age"

      - name: Upload encrypted artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: assembled-${{ inputs.environment }}-${{ github.run_id }}
          # The mesh document is only present in repos that declare mesh
          # fragments; a missing path is skipped as long as the .age file
          # matches, so no `if-no-files-found` tuning is needed.
          path: |
            out/assembled-${{ inputs.environment }}.age
            out/assembled-${{ inputs.environment }}-mesh.yaml
          retention-days: 1

      - name: Summary
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "### Materialized config for \`${INPUT_ENVIRONMENT}\`"
            echo ""
            echo "Download the artifact \`assembled-${INPUT_ENVIRONMENT}-${RUN_ID}\` and decrypt:"
            echo ""
            echo '```bash'
            echo "age -d -i ~/.ssh/id_ed25519 < assembled-${INPUT_ENVIRONMENT}.age > assembled.yaml"
            echo '```'
            echo ""
            echo "If this repo declares mesh fragments, the artifact also holds \`assembled-${INPUT_ENVIRONMENT}-mesh.yaml\` — the standalone \`{version, mesh}\` document for mesh nodes (\`FERRUM_MESH_FILE_CONFIG_PATH\`). It holds no credentials, so it is not encrypted."
            echo ""
            echo "Artifact retention: **1 day**. The encrypted blob is safe against GitHub-side compromise; the decrypted file never touches the repo."
          } >> "$GITHUB_STEP_SUMMARY"
