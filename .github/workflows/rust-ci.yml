name: Rust CI

# The workflow reports its `check` status on every PR so it is safe to require
# in a ruleset. Resource-only PRs still skip the Rust checkout/build internally
# and are served by validate-pr.yml; a top-level paths filter would leave the
# required check permanently "Expected" on those PRs.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'examples/**'
      - '.cargo/**'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'build.rs'
      - 'rust-toolchain.toml'
      - 'rust-toolchain'
      - 'rustfmt.toml'
      - '.rustfmt.toml'
      - 'clippy.toml'
      - '.clippy.toml'
      - 'Dockerfile'
      - '.github/workflows/rust-ci.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check out trusted path classifier
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-scope
          persist-credentials: false

      - name: Detect Rust-impacting PR paths
        if: github.event_name == 'pull_request'
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          pages_file=$(mktemp)
          trap 'rm -f "$pages_file"' EXIT
          gh api "repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100" \
            --paginate --slurp > "$pages_file"
          current_changed=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.changed_files')
          [[ "$current_changed" =~ ^[0-9]+$ ]] || {
            echo "::warning::GitHub returned an invalid current changed-file count; running Rust CI fail-safe."
            current_changed=-1
          }
          helper=trusted-scope/.github/scripts/changed_files.py
          if [ -f "$helper" ] && [ "$current_changed" -ge 0 ]; then
            result=$(python3 trusted-scope/.github/scripts/changed_files.py \
              "$pages_file" "$current_changed" rust)
          else
            # The helper is absent only while the PR that first introduces it
            # is based on an older main. Never execute the candidate copy;
            # classify as incomplete so every Rust gate runs fail-safe.
            echo "::warning::Trusted path classifier is not present on the PR base; running Rust CI fail-safe."
            result='{"complete":false,"matches":true}'
          fi
          rust=$(jq -r '.matches' <<< "$result")
          if [ "$(jq -r '.complete' <<< "$result")" != true ]; then
            echo "::warning::Changed-file pagination was incomplete; running Rust CI fail-safe."
            rust=true
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        if: github.event_name != 'pull_request' || steps.scope.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action; Rust 1.98.0
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        if: github.event_name != 'pull_request' || steps.scope.outputs.rust == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-ci-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-ci-

      - name: cargo fmt --check
        if: github.event_name != 'pull_request' || steps.scope.outputs.rust == 'true'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: github.event_name != 'pull_request' || steps.scope.outputs.rust == 'true'
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        if: github.event_name != 'pull_request' || steps.scope.outputs.rust == 'true'
        run: cargo test --test unit_tests

  coverage:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check out trusted path classifier
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-scope
          persist-credentials: false

      - name: Detect Rust-impacting PR paths
        if: github.event_name == 'pull_request'
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          pages_file=$(mktemp)
          trap 'rm -f "$pages_file"' EXIT
          gh api "repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100" \
            --paginate --slurp > "$pages_file"
          current_changed=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.changed_files')
          [[ "$current_changed" =~ ^[0-9]+$ ]] || {
            echo "::warning::GitHub returned an invalid current changed-file count; running coverage fail-safe."
            current_changed=-1
          }
          helper=trusted-scope/.github/scripts/changed_files.py
          if [ -f "$helper" ] && [ "$current_changed" -ge 0 ]; then
            result=$(python3 trusted-scope/.github/scripts/changed_files.py \
              "$pages_file" "$current_changed" rust)
          else
            # Bootstrap the trusted helper by running the complete coverage
            # gate. The PR-controlled helper is deliberately never executed.
            echo "::warning::Trusted path classifier is not present on the PR base; running coverage fail-safe."
            result='{"complete":false,"matches":true}'
          fi
          rust=$(jq -r '.matches' <<< "$result")
          if [ "$(jq -r '.complete' <<< "$result")" != true ]; then rust=true; fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        if: github.event_name != 'pull_request' || steps.scope.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action; Rust 1.98.0
        with:
          toolchain: 1.98.0
          components: llvm-tools-preview

      - name: Cache cargo registry + target
        if: github.event_name != 'pull_request' || steps.scope.outputs.rust == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-rust-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-coverage-

      - name: Install cargo-llvm-cov
        if: github.event_name != 'pull_request' || steps.scope.outputs.rust == 'true'
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-llvm-cov@0.9.0

      - name: cargo llvm-cov
        if: github.event_name != 'pull_request' || steps.scope.outputs.rust == 'true'
        run: cargo llvm-cov --test unit_tests --lcov --output-path lcov.info

      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || steps.scope.outputs.rust == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lcov
          path: lcov.info
