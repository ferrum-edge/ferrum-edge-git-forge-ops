name: Release

on:
  push:
    branches: [main]
    # `apply-on-merge.yml` and `rotate.yml` push the ownership ledger (and, in
    # file mode, the assembled documents) straight to `main` as the state-writer
    # App. Those commits contain no build input, so rebuilding and republishing
    # the image for them wastes a multi-platform build and moves the `latest`
    # tag for no reason. They used to carry `[skip ci]`, which suppressed every
    # workflow indiscriminately, including the required checks; scoping the
    # exclusion to the paths CI actually should ignore is the narrower fix.
    paths-ignore:
      - '.state/**'
      - 'assembled/**'
      # The signed image is built from Dockerfile/src, not the post-publication
      # record. Filling its digest and evidence must not republish :latest.
      - 'release/**'
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize-release:
    name: Require a checked, merged pull request
    # Publishing runs on the upstream repository, or wherever an owner has
    # explicitly opted in. A `fork == false` test used to stand in for
    # "upstream": it is also true of every copy made through "Use this
    # template", so a customer's own repository would try to publish to the
    # upstream Docker Hub namespace on its first push to `main` and fail.
    # Naming the repository is the check that actually means upstream.
    if: github.repository == 'ferrum-edge/ferrum-edge-git-forge-ops' || vars.GITFORGEOPS_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    # Fifteen minutes for PR checks, then the existing twenty-minute lifecycle
    # wait and artifact verification. Individual API calls share the PR budget.
    timeout-minutes: 45
    permissions:
      contents: read
      checks: read
      pull-requests: read
      # Reading the lifecycle workflow's run history and downloading its
      # sealed result artifact.
      actions: read
    steps:
      - name: Verify the published commit passed every required check
        timeout-minutes: 16
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          pulls_file=$(mktemp)
          checks_file=$(mktemp)
          all_checks_file=$(mktemp)
          checks_error_file=$(mktemp)
          all_checks_error_file=$(mktemp)
          association_file=$(mktemp)
          pr_file=$(mktemp)
          rules_file=$(mktemp)
          runs_file=$(mktemp)
          trap 'rm -f "$pulls_file" "$checks_file" "$all_checks_file" "$checks_error_file" "$all_checks_error_file" "$association_file" "$pr_file" "$rules_file" "$runs_file"' EXIT

          deadline=$(( $(date +%s) + 900 ))
          remaining_budget() {
            local remaining
            remaining=$((deadline - $(date +%s)))
            [ "$remaining" -gt 0 ] || {
              echo "::error::Timed out waiting for same-head release checks (900 seconds)." >&2
              return 1
            }
            echo "$remaining"
          }

          pr=
          for attempt in 1 2 3 4 5; do
            timeout --kill-after=5s "$(remaining_budget)s" \
              gh api "repos/${REPO}/commits/${RELEASE_SHA}/pulls?per_page=100" \
              --paginate --slurp > "$pulls_file" || {
              echo "::error::Release merge association could not be read."
              exit 1
            }
            jq -e -s --arg sha "$RELEASE_SHA" --arg branch "$DEFAULT_BRANCH" --arg repo "$REPO" '
                def positive_integer: type == "number" and . > 0 and . == floor;
                if length != 1 or (.[0] | type) != "array" or (.[0] | length) == 0 then
                  error("invalid commit-to-PR response")
                else
                  .[0]
                  | if any(.[]; type != "array") or any(.[][]; type != "object") then
                      error("invalid commit-to-PR pages")
                    else . end
                  | if any(.[][];
                      (.number | positive_integer | not) or (.id | positive_integer | not) or
                      (.state != "open" and .state != "closed") or
                      (.base.ref | type) != "string" or (.base.repo.full_name | type) != "string" or
                      (.head.sha | type) != "string" or
                      (.merged_at != null and (.merged_at | type) != "string")
                    ) then error("invalid commit-to-PR record") else . end
                  | ([.[][]]) as $associated
                  | if ($associated | group_by(.number) | any(.[]; (unique | length) != 1)) then
                      error("conflicting commit-to-PR identities") else . end
                  | ([
                    .[][]
                    | select(
                        .state == "closed" and
                        .base.ref == $branch and
                        (.merged_at | type) == "string"
                      )
                  ] | unique_by(.number)) as $candidates
                  | ([$candidates[] | select(.merge_commit_sha == $sha)]) as $exact
                  | (if ($exact | length) > 0 then $exact else $candidates end)
                  | if length == 0 then
                      if ($associated | length) == 0 then null
                      else error("invalid merged default-branch association") end
                    elif length == 1 then
                      .[0]
                      | if (.number | positive_integer) and (.id | positive_integer) and
                          .base.repo.full_name == $repo and
                          (.head.sha | type) == "string" and
                          (.head.sha | test("^[0-9a-f]{40}$")) and
                          (.merge_commit_sha | type) == "string" and
                          (.merge_commit_sha | test("^[0-9a-f]{40}$"))
                        then {number, id, merged_at, merge_commit_sha, head_sha: .head.sha}
                        else error("invalid merged PR identity") end
                    else error("release commit must map to exactly one merged PR")
                    end
                end
              ' "$pulls_file" > "$association_file" || {
              # jq's false/null result means no association yet. Parse errors,
              # ambiguous associations and malformed identities never retry.
              status=$?
              [ "$status" -eq 1 ] || exit 1
            }
            if [ "$(cat "$association_file")" != null ]; then
              pr=$(jq -er '.number' "$association_file")
              break
            fi
            pr=
            echo "Release merge association is not yet available and unambiguous; retrying ($attempt/5)." >&2
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 2)); fi
          done
          [ -n "$pr" ] || {
            echo "::error::Release commit could not be mapped to exactly one merged PR."
            exit 1
          }

          expected_head=$(jq -er '.head_sha' "$association_file")
          verify_pr_identity() {
            timeout --kill-after=5s "$(remaining_budget)s" \
              gh api "repos/${REPO}/pulls/${pr}" > "$pr_file" || return 1
            jq -e -s --slurpfile association "$association_file" \
              --arg branch "$DEFAULT_BRANCH" --arg repo "$REPO" '
              length == 1 and (.[0] | type) == "object" and
              (.[0] | .id == $association[0].id and
                .number == $association[0].number and .state == "closed" and .merged == true and
                .merged_at == $association[0].merged_at and
                .merge_commit_sha == $association[0].merge_commit_sha and
                .head.sha == $association[0].head_sha and
                .base.ref == $branch and .base.repo.full_name == $repo)
            ' "$pr_file" >/dev/null
          }

          branch_path=$(jq -nr --arg branch "$DEFAULT_BRANCH" '$branch | @uri')
          classify_check_lookup() {
            local status=$1 output=$2 errors=$3 mode=$4 head_branch diagnostic
            [ "$status" -ne 0 ] || return 0
            # gh errors before exporting JSON for an empty rollup. Accept only
            # that diagnostic; validate same-head evidence before waiting.
            head_branch=$(jq -er '.head.ref | select(type == "string" and length > 0)' "$pr_file") || return 1
            diagnostic=$(cat "$errors")
            if [ "$status" -eq 1 ] && [ ! -s "$output" ]; then
              if [ "$diagnostic" = "no checks reported on the '${head_branch}' branch" ]; then
                echo all
              elif [ "$mode" = required ] && [ "$diagnostic" = "no required checks reported on the '${head_branch}' branch" ]; then
                echo required
              else
                cat "$errors" >&2
                return 1
              fi
              echo '[]' > "$output"
            else
              cat "$errors" >&2
              return 1
            fi
          }
          while :; do
            verify_pr_identity || {
              echo "::error::Merged PR #${pr} changed identity, head or default-branch association."
              exit 1
            }
            # Read the effective rules each time: an accepted context cannot
            # pass by absence after the ruleset makes it required. Preserve the
            # ruleset's App binding when checking the immutable head below.
            timeout --kill-after=5s "$(remaining_budget)s" \
              gh api "repos/${REPO}/rules/branches/${branch_path}?per_page=100" \
              --paginate --slurp > "$rules_file" || {
              echo "::error::Required-check settings could not be read."
              exit 1
            }
            status=0
            timeout --kill-after=5s "$(remaining_budget)s" \
              gh pr checks "$pr" --repo "$REPO" --required \
              --json bucket,name,workflow > "$checks_file" 2> "$checks_error_file" || status=$?
            required_missing=$(classify_check_lookup "$status" "$checks_file" "$checks_error_file" required) || {
              echo "::error::Required checks for merged PR #${pr} could not be read."
              cat "$checks_file"
              exit 1
            }

            # --required hides transitional results. Inspect the full rollup
            # too; every error other than verified absence fails closed.
            status=0
            timeout --kill-after=5s "$(remaining_budget)s" \
              gh pr checks "$pr" --repo "$REPO" \
              --json bucket,name,workflow > "$all_checks_file" 2> "$all_checks_error_file" || status=$?
            all_missing=$(classify_check_lookup "$status" "$all_checks_file" "$all_checks_error_file" all) || {
              echo "::error::All checks for merged PR #${pr} could not be read."
              exit 1
            }

            # gh deduplicates by startedAt: a queued retry can disappear behind
            # an older success. Read every run on the expected head and select
            # the newest check-run ID per source-bound context instead.
            timeout --kill-after=5s "$(remaining_budget)s" \
              gh api "repos/${REPO}/commits/${expected_head}/check-runs?per_page=100&filter=all" \
              --paginate --slurp > "$runs_file" || {
              echo "::error::Same-head check-run evidence could not be read."
              exit 1
            }

            verdict=$(jq -e -r -s --argjson required '[
              "Rust CI / rust-ci-check",
              "Security / security-cargo-audit",
              "Security / security-supply-chain-policy",
              "GitForgeOps State Guard / state-guard-reject-state-edits",
              "GitForgeOps PR Static Validation / gitforgeops-required-static-validation"
            ]' --argjson accepted '[
              "GitForgeOps Supply-Chain Policy / trusted-supply-chain-policy"
            ]' --slurpfile all_checks "$all_checks_file" \
              --slurpfile rules "$rules_file" --slurpfile runs "$runs_file" --arg head "$expected_head" \
              --arg required_missing "$required_missing" --arg all_missing "$all_missing" '
              def positive_integer: type == "number" and . > 0 and . == floor;
              def check_contexts:
                if type != "array" then error("invalid checks response") else . end
                | if any(.[]; type != "object") then error("invalid check record") else . end
                | if any(.[];
                    (.name | type) != "string" or
                    .name == "" or
                    (.bucket | type) != "string" or
                    (.bucket != "pass" and .bucket != "pending" and .bucket != "fail" and
                      .bucket != "cancel" and .bucket != "skipping") or
                    (.workflow != null and (.workflow | type) != "string")
                  ) then error("invalid check fields") else . end
                | map({
                    context: (if (.workflow // "") == "" then .name else .workflow + " / " + .name end),
                    name, bucket
                  });
              if length != 1 or ($all_checks | length) != 1 or
                  ($rules | length) != 1 or ($rules[0] | type) != "array" or
                  ($rules[0] | length) == 0 or
                  ($runs | length) != 1 or ($runs[0] | type) != "array" or ($runs[0] | length) == 0 then
                error("expected one response per checks lookup")
              else
                (.[0] | check_contexts) as $checks
                | ($all_checks[0] | check_contexts) as $reported
                | ($rules[0] | map(
                    if type != "array" then error("invalid rules page") else .[] end
                    | if type != "object" or (.type | type) != "string" then
                      error("invalid rule record")
                    elif .type == "required_status_checks" then
                      .parameters.required_status_checks
                      | if type != "array" then error("invalid required-check settings") else . end
                      | .[]
                      | if (.context | type) != "string" or .context == "" or
                          (.integration_id | positive_integer | not) then
                          error("required checks must be source-bound")
                        else {name: .context, app: .integration_id} end
                    else empty end
                  ) | unique) as $settings
                | ($required + $accepted | map(split(" / ")[-1])) as $launch_names
                | if ($required | any(. as $context |
                    ($settings | map(select(.name == ($context | split(" / ")[-1]) and .app == 15368)) | length) != 1)) or
                    ($settings | any(. as $setting |
                      ($launch_names | index($setting.name)) != null and $setting.app != 15368)) then
                    error("launch-required checks must retain their GitHub Actions source binding")
                  else . end
                | ($settings + ($accepted | map({name: split(" / ")[-1], app: 15368})) | unique) as $watched
                | ($required + ($accepted | map(select(. as $context |
                    any($settings[]; .name == ($context | split(" / ")[-1])))))) as $required_contexts
                | if any($checks[]; . as $check | all($settings[]; .name != $check.name)) then
                    error("required check has no source-bound rule") else . end
                | ($runs[0] | map(
                    if type != "object" or (.check_runs | type) != "array" or
                        (.total_count | type) != "number" or .total_count < 0 or
                        .total_count != (.total_count | floor) then
                      error("invalid check-run page")
                    else .check_runs[] end
                    | if type != "object" or (.id | positive_integer | not) or
                        (.name | type) != "string" or .name == "" or .head_sha != $head or
                        (.app.id | positive_integer | not) or
                        (.status != "queued" and .status != "in_progress" and .status != "completed" and
                          .status != "pending" and .status != "waiting" and .status != "requested") or
                        (if .status == "completed" then
                          .conclusion as $conclusion
                          | ["success", "failure", "cancelled", "timed_out", "action_required", "neutral", "skipped", "stale", "startup_failure"]
                          | index($conclusion) != null
                          else .conclusion == null end | not)
                      then error("invalid or wrong-head check run") else . end
                  )) as $history
                # Pagination can race a new retry even when both CLI samples
                # pass. Every page must agree on the total, and distinct IDs
                # must account for it before selecting any newest result.
                | ($runs[0] | map(.total_count) | unique) as $counts
                | ($history | group_by(.id)) as $identities
                | if ($counts | length) != 1 then
                    error("inconsistent check-run page counts")
                  elif ($identities | any(.[]; (unique | length) != 1)) then
                    error("conflicting check-run identities")
                  elif ($identities | any(.[]; length != 1)) then
                    error("duplicate check-run identities")
                  elif ($identities | length) != $counts[0] then
                    error("incomplete check-run evidence")
                  else . end
                | ($watched | map(. as $setting |
                    ($history | map(select(.name == $setting.name and .app.id == $setting.app))
                      | if length == 0 then null else max_by(.id) end) as $latest
                    | {name, app, latest: $latest}
                  )) as $latest
                | ($checks + ($reported | map(select(.context as $context | ($required + $accepted | index($context)) != null)))) as $guarded
                # Runs may arrive after an empty CLI sample. They still cannot
                # authorize it: an empty lookup must be sampled again.
                | if any($guarded[]; .bucket != "pass" and .bucket != "pending") or
                    any($latest[]; .latest != null and .latest.status == "completed" and .latest.conclusion != "success") then
                    error("required or transitional check failed, was cancelled or skipped")
                  elif $required_missing != "" or $all_missing != "" or
                    any($checks[]; .bucket == "pending") or
                    ($required_contexts | any(. as $wanted | all($checks[]; .context != $wanted))) or
                    any($guarded[]; .bucket == "pending") or
                    any($latest[]; (. as $check | ($settings | any(.name == $check.name and .app == $check.app))) and .latest == null) or
                    any($latest[]; .latest != null and .latest.status != "completed") then
                    "wait"
                  else "pass" end
              end
            ' "$checks_file") || {
              echo "::error::The merged PR lacks successful launch-required checks or has an unsuccessful transitional check or invalid check response."
              cat "$checks_file" "$all_checks_file"
              exit 1
            }
            # Both gh lookups follow a mutable PR number; bracket them with the
            # identity from the commit association, including the final pass.
            verify_pr_identity || {
              echo "::error::Merged PR #${pr} changed while its checks were sampled."
              exit 1
            }
            remaining=$(remaining_budget) || exit 1
            if [ "$verdict" = pass ]; then
              echo "Merged PR #${pr} has successful source-bound checks on ${expected_head}."
              break
            fi
            echo "Required or transitional checks are pending or missing on ${expected_head}; waiting (${remaining}s left)."
            if [ "$remaining" -gt 15 ]; then remaining=15; fi
            sleep "$remaining"
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check release baseline consistency
        if: github.repository == 'ferrum-edge/ferrum-edge-git-forge-ops'
        run: python3 .github/scripts/check_release_baseline.py

      # The required-checks test above proves the unit and policy suites
      # passed. It cannot prove the product was run: the lifecycle suite is
      # not a per-PR required check, because it needs a gateway build and
      # turning every pull request red when that is unavailable would train
      # people to override the gate rather than fix it.
      #
      # So publication verifies it directly, bound to the exact revision being
      # published. Every way of NOT having a result — never ran, ran for
      # another revision, ran against another gateway build, was cancelled
      # mid-run, skipped a scenario — fails here, because a release gate that
      # can be satisfied by an absence is not a gate.
      - name: Require a lifecycle acceptance result for this revision
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          runs_file=$(mktemp)
          trap 'rm -f "$runs_file"' EXIT

          # Both workflows start on the same push, so a single sample is
          # always too early — the release would be permanently red and the
          # gate would be something operators re-run past rather than read.
          # Wait for the lifecycle run for THIS revision to finish, bounded,
          # and say which of the three outcomes happened.
          run_ids=
          for attempt in $(seq 1 40); do
            gh api "repos/${REPO}/actions/workflows/lifecycle.yml/runs?head_sha=${RELEASE_SHA}&per_page=20" \
              > "$runs_file" || {
              echo "::error::The lifecycle acceptance workflow's run history could not be read."
              exit 1
            }
            # Every successful run, newest first. A newer run is not
            # necessarily a certifying one: a push-triggered run records the
            # GitHub-repository scenarios as `skipped`, and it must not hide an
            # older dispatched run that carries the operator's attestation.
            run_ids=$(jq -r '
              [.workflow_runs[]? | select(.conclusion == "success")]
              | sort_by(.updated_at) | reverse | .[].id | tostring
            ' "$runs_file")
            [ -n "$run_ids" ] && break

            pending=$(jq -r '
              [.workflow_runs[]? | select(.status != "completed")] | length
            ' "$runs_file")
            if [ "$pending" -gt 0 ]; then
              echo "Lifecycle acceptance is still running for ${RELEASE_SHA} (attempt ${attempt}/40)."
              sleep 30
              continue
            fi
            # Completed, none successful: a finished run that did not certify
            # is a different thing from one that has not happened, and the
            # operator needs to be told which.
            if [ "$(jq -r '.total_count // 0' "$runs_file")" -gt 0 ]; then
              echo "::error::Lifecycle acceptance ran for ${RELEASE_SHA} and did not pass. Fix the scenarios it reported, not the gate."
              exit 1
            fi
            echo "Lifecycle acceptance has not started for ${RELEASE_SHA} yet (attempt ${attempt}/40)."
            sleep 30
          done
          [ -n "$run_ids" ] || {
            echo "::error::No successful GitForgeOps Lifecycle Acceptance run exists for ${RELEASE_SHA} after waiting. Dispatch the workflow for this commit and re-run the release."
            exit 1
          }

          # The suite runs whichever allowlisted build the installer resolves.
          # Publication requires the exact tested build named by the committed
          # upstream release record. Opted-in customer publishers keep their
          # existing allowlist gate because their pairing can differ.
          if [ "$REPO" = 'ferrum-edge/ferrum-edge-git-forge-ops' ]; then
            gateway_args=(--gateway "$(jq -er '.tested_gateway.binary_sha256' release/baseline.json)")
          else
            gateway_args=(--gateway-allowlist .github/ferrum-edge-checksums.txt)
          fi

          # Accept the newest successful run whose own result certifies this
          # revision. Every candidate is verified with the same arguments; a
          # run without an artifact, or whose result does not certify, only
          # moves the search to the next older run. None certifying refuses.
          certified=
          for run_id in $run_ids; do
            dir="acceptance/${run_id}"
            echo "### Lifecycle run ${run_id}" >> "$GITHUB_STEP_SUMMARY"
            if ! gh run download "$run_id" --repo "$REPO" \
              --name "lifecycle-result-${RELEASE_SHA}" --dir "$dir"; then
              echo "Lifecycle run ${run_id} published no result artifact for ${RELEASE_SHA}; trying the next older successful run."
              echo "No result artifact." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if python3 .github/scripts/lifecycle_result.py verify \
              --result "${dir}/lifecycle-result.json" \
              --revision "$RELEASE_SHA" \
              "${gateway_args[@]}" \
              --summary "$GITHUB_STEP_SUMMARY"; then
              certified=$run_id
              break
            fi
            echo "Lifecycle run ${run_id} does not certify ${RELEASE_SHA}; trying the next older successful run."
          done
          [ -n "$certified" ] || {
            echo "::error::No successful GitForgeOps Lifecycle Acceptance run for ${RELEASE_SHA} published a result that certifies it; every candidate is listed in the step summary. Dispatch the workflow for this commit with the GitHub-repository attestation and re-run the release."
            exit 1
          }
          echo "Lifecycle run ${certified} certifies ${RELEASE_SHA}."

  docker:
    name: Build and push Docker image
    # Only run on the upstream repo by default. Template copies and forks
    # consume the already-published image and don't need to rebuild. A
    # repository that wants to maintain its own image can opt in by setting
    # repo variable `GITFORGEOPS_RELEASE_ENABLED=true` and pointing
    # `DOCKERHUB_IMAGE` at a namespace it can push to (GHCR always
    # derives from `github.repository`, so no override needed there).
    needs: authorize-release
    if: github.repository == 'ferrum-edge/ferrum-edge-git-forge-ops' || vars.GITFORGEOPS_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release baseline consistency
        if: github.repository == 'ferrum-edge/ferrum-edge-git-forge-ops'
        run: python3 .github/scripts/check_release_baseline.py

      - name: Ensure release tag points to the default branch
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "Release tag must point to a commit reachable from the default branch." >&2
            exit 1
          fi

      - name: Verify and record immutable build inputs
        run: >-
          python3 .github/scripts/check_supply_chain.py
          --write-manifest supply-chain-inputs.json

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ vars.DOCKERHUB_IMAGE || 'ferrumedge/ferrum-edge-git-forge-ops' }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main-{{sha}},enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Publish signed GHCR build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # v4 defaults to additional organization storage records, which need
          # artifact-metadata:write. Preserve the signed-attestation contract.
          create-storage-record: false

      # `docker/build-push-action` publishes ONE manifest digest to BOTH
      # registries, so the step above covers those exact bytes — but an
      # attestation is bound to its `subject-name`, and a consumer pulling
      # `docker.io/<image>` verifies against that name. Without this second
      # subject, `gh attestation verify oci://docker.io/...` finds nothing and
      # the Docker Hub image is effectively unattested.
      #
      # `push-to-registry` is deliberately off here. The attestation is
      # recorded in GitHub's attestation store, which `gh attestation verify`
      # consults for an image in any registry, so verification works either
      # way; writing it into Docker Hub's referrers instead would make every
      # release depend on a third-party registry's referrers support, and a
      # failure there would land after the image was already pushed. GHCR
      # keeps `push-to-registry: true` because it is this project's primary
      # distribution point and is known to support it.
      #
      # DOCKERHUB_IMAGE is documented as `owner/name`; the registry host is
      # added here because an attestation subject must be fully qualified.
      - name: Publish signed Docker Hub build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/${{ vars.DOCKERHUB_IMAGE || 'ferrumedge/ferrum-edge-git-forge-ops' }}
          subject-digest: ${{ steps.build.outputs.digest }}
          create-storage-record: false

      - name: Bind image digest into build-input record
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          path = Path("supply-chain-inputs.json")
          manifest = json.loads(path.read_text())
          manifest["published_image_digest"] = os.environ["IMAGE_DIGEST"]
          path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          PY

      - name: Upload immutable build-input record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supply-chain-inputs-${{ github.sha }}
          path: supply-chain-inputs.json
          if-no-files-found: error
          retention-days: 90
