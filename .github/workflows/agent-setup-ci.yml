name: Agent Setup CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
    paths:
      - '.agents/**'
      - '.claude/**'
      - '.github/scripts/check_agent_setup.py'
      - '.github/scripts/tests/test_agent_setup.py'
      - '.github/workflows/agent-setup-ci.yml'
      - '.github/workflows/agent-setup-policy.yml'
      - '.github/CODEOWNERS'

permissions:
  contents: read

concurrency:
  group: agent-setup-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check out trusted base validator
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .agent-setup-base
          persist-credentials: false

      - name: Validate agent setup
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == pull_request ]]; then
            validator=.agent-setup-base/.github/scripts/check_agent_setup.py
            [[ -f "$validator" ]] || {
              echo "Trusted default-branch validator is unavailable; refusing candidate bootstrap." >&2
              exit 1
            }
          else
            validator=.github/scripts/check_agent_setup.py
          fi
          python3 "$validator" --root "$GITHUB_WORKSPACE"

      - name: Test agent setup validator
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_agent_setup.py'

      - name: Parse shell dispatchers
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find .agents/skills \( -type f -o -type l \) -name '*.sh' -print0)

      - name: Lint shell dispatchers
        run: |
          set -euo pipefail
          mapfile -d '' scripts < <(find .agents/skills \( -type f -o -type l \) -name '*.sh' -print0)
          shellcheck --external-sources --source-path=SCRIPTDIR "${scripts[@]}"
