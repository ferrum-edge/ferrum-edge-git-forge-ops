name: Agent Setup CI

on:
  pull_request:
    paths:
      - '.agents/**'
      - '.claude/**'
      - '.github/scripts/check_agent_setup.py'
      - '.github/scripts/tests/test_agent_setup.py'
      - '.github/workflows/agent-setup-ci.yml'
  push:
    branches: [main]
    paths:
      - '.agents/**'
      - '.claude/**'
      - '.github/scripts/check_agent_setup.py'
      - '.github/scripts/tests/test_agent_setup.py'
      - '.github/workflows/agent-setup-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate agent setup
        run: python3 .github/scripts/check_agent_setup.py

      - name: Test agent setup validator
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_agent_setup.py'

      - name: Parse shell dispatchers
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find .agents/skills -type f -name '*.sh' -print0)

      - name: Lint shell dispatchers
        run: |
          set -euo pipefail
          mapfile -d '' scripts < <(find .agents/skills -type f -name '*.sh' -print0)
          shellcheck --external-sources --source-path=SCRIPTDIR "${scripts[@]}"
