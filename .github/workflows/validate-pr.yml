name: GitForgeOps PR Static Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

# This workflow executes code from the pull request, including Cargo build
# scripts. It therefore receives no GitHub Environment, gateway credential,
# mTLS material, or write-capable token. The separate workflow_run-based live
# review consumes only a sanitized declarative artifact with a trusted binary.
permissions:
  contents: read
  pull-requests: read

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.classify.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check out trusted path classifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted-scope
          persist-credentials: false

      - name: Classify declarative changes
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          pages_file=$(mktemp)
          trap 'rm -f "$pages_file"' EXIT
          stable=false
          for attempt in 1 2 3; do
            before=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")
            before_head=$(jq -r '.head.sha' <<< "$before")
            before_base=$(jq -r '.base.sha' <<< "$before")
            before_ref=$(jq -r '.base.ref' <<< "$before")
            before_count=$(jq -r '.changed_files' <<< "$before")
            [[ "$before_head" =~ ^[0-9a-f]{40}$ && "$before_base" =~ ^[0-9a-f]{40}$ && "$before_count" =~ ^[0-9]+$ ]] || exit 1
            [ "$before_head" = "$EXPECTED_HEAD_SHA" ] && [ "$before_ref" = "$DEFAULT_BRANCH" ] || exit 1
            gh api "repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100" --paginate --slurp > "$pages_file"
            after=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")
            after_head=$(jq -r '.head.sha' <<< "$after")
            after_base=$(jq -r '.base.sha' <<< "$after")
            after_ref=$(jq -r '.base.ref' <<< "$after")
            after_count=$(jq -r '.changed_files' <<< "$after")
            if [ "$before_head" = "$after_head" ] && [ "$before_base" = "$after_base" ] && \
               [ "$before_ref" = "$after_ref" ] && [ "$before_count" = "$after_count" ]; then
              current_changed=$after_count
              stable=true
              break
            fi
            echo "::warning::PR file metadata changed during attempt ${attempt}; retrying."
          done
          [ "$stable" = true ] || exit 1
          helper=trusted-scope/.github/scripts/changed_files.py
          if [ -f "$helper" ]; then
            result=$(python3 trusted-scope/.github/scripts/changed_files.py \
              "$pages_file" "$current_changed" declarative)
          else
            # The helper does not exist on the base of its own bootstrap PR.
            # Run validation fail-safe rather than executing candidate code.
            echo "::warning::Trusted path classifier is not present on the PR base; validating fail-safe."
            result='{"complete":false,"matches":true}'
          fi
          relevant=$(jq -r '.matches' <<< "$result")
          if [ "$(jq -r '.complete' <<< "$result")" != true ]; then
            echo "::warning::Changed-file pagination was incomplete; validating fail-safe."
            relevant=true
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

  list-envs:
    needs: scope
    if: needs.scope.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    outputs:
      envs: ${{ steps.list.outputs.envs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action; Rust 1.98.0
        with:
          toolchain: 1.98.0

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build gitforgeops
        run: cargo install --path . --locked

      - name: Enumerate environments
        id: list
        run: |
          set -euo pipefail
          envs=$(gitforgeops envs --format json | jq -c .)
          jq -e '
            type == "array" and
            all(.[]; type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$"))
          ' <<< "$envs" >/dev/null || {
            echo "::error::Every environment must be a single safe path component."
            exit 1
          }
          echo "envs=$envs" >> "$GITHUB_OUTPUT"

  validate:
    needs: list-envs
    if: needs.list-envs.outputs.envs != '[]' && needs.list-envs.outputs.envs != ''
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.list-envs.outputs.envs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The installer runs with GITHUB_TOKEN. This job also builds the pull
      # request's own Cargo tree, so the *script* must not be one the pull
      # request wrote: it comes from the protected default branch instead.
      - name: Check out trusted validator installer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted-validator
          persist-credentials: false

      - name: Download verified ferrum-edge binary
        env:
          # The installer resolves the upstream asset by name and refuses to
          # execute any build whose SHA-256 is absent from the reviewed
          # .github/ferrum-edge-checksums.txt allowlist.
          GITHUB_TOKEN: ${{ github.token }}
        # Trusted code, candidate allowlist. A pull request that refreshes the
        # validator pin has to be validated against the digests it is adding,
        # so the second argument is deliberately the candidate's allowlist. A
        # hostile allowlist can only approve a different *genuine upstream*
        # build — the installer still requires the publisher's own checksum to
        # match — and this job carries no secret beyond a read-only token.
        # Privileged consumers (trusted-pr-review.yml, apply-on-merge.yml) use
        # the trusted allowlist instead.
        run: |
          bash trusted-validator/.github/scripts/install-ferrum-edge.sh \
            "$RUNNER_TEMP/gitforgeops-validator-bin/ferrum-edge" \
            .github/ferrum-edge-checksums.txt

      # The probe also selects its fixture relative to the trusted script.
      # Candidate code or fixtures cannot approve a candidate digest.
      - name: Require resource-label compatibility
        run: |
          bash trusted-validator/.github/scripts/check-validator-resource-labels.sh \
            "$RUNNER_TEMP/gitforgeops-validator-bin/ferrum-edge"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action; Rust 1.98.0
        with:
          toolchain: 1.98.0

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install gitforgeops
        run: cargo install --path . --locked

      - name: Validate
        env:
          FERRUM_ENV: ${{ matrix.environment }}
        run: gitforgeops validate --format github-annotations

      - name: Static review output
        if: always()
        env:
          FERRUM_ENV: ${{ matrix.environment }}
        run: gitforgeops review

  # Always run, including pin-only, workflow-only and Rust-only PRs, and when
  # the repository has no configured environments or desired resources.
  validator-pairing:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check out trusted pairing installer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted-validator
          persist-credentials: false

      - name: Download pairing validator
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash trusted-validator/.github/scripts/install-ferrum-edge.sh \
            "$RUNNER_TEMP/gitforgeops-validator-bin/ferrum-edge" \
            .github/ferrum-edge-checksums.txt

      # Keep both the probe and its script-relative fixture on the trusted ref.
      - name: Require resource-label compatibility
        run: |
          bash trusted-validator/.github/scripts/check-validator-resource-labels.sh \
            "$RUNNER_TEMP/gitforgeops-validator-bin/ferrum-edge"

      # Preserve the protected install/probe bindings above. This extends the
      # existing required pairing job without changing a privileged binding.
      # No cache is restored or published by the producer/consumer builds.
      - name: Check out pinned Alloy producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ferrum-edge/ferrum-alloy
          ref: 690aed7a9fa8458aeea4ac8416170c8daeb0470b
          path: alloy-producer
          persist-credentials: false

      - name: Verify Alloy producer provenance
        working-directory: alloy-producer
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = 690aed7a9fa8458aeea4ac8416170c8daeb0470b ]
          sha256sum --check "$GITHUB_WORKSPACE/tests/fixtures/alloy-producer/SHA256SUMS"

      - name: Install Alloy consumer test toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action; Rust 1.98.0
        with:
          toolchain: 1.98.0

      - name: Build Alloy producer and GitForgeOps consumer
        run: |
          set -euo pipefail
          cargo +1.98.0 build --locked --manifest-path alloy-producer/Cargo.toml \
            -p ferrum-alloy-cli --bin ferrum-alloy --target-dir "$RUNNER_TEMP/alloy-producer-target"
          cargo build --locked --bin gitforgeops

      - name: Generate actual Alloy GitForgeOps fixture trees
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/alloy-generated"
          for fixture in orders-api plain-http; do
            "$RUNNER_TEMP/alloy-producer-target/debug/ferrum-alloy" edge export \
              --manifest "alloy-producer/contracts/fixtures/manifests/${fixture}.toml" \
              --format gitforgeops --output "$RUNNER_TEMP/alloy-generated/${fixture}"
          done

      - name: Require generated Alloy consumer qualification
        env:
          GITFORGEOPS_ALLOY_FIXTURE_ROOT: ${{ runner.temp }}/alloy-generated
          GITFORGEOPS_ALLOY_VALIDATOR: ${{ runner.temp }}/gitforgeops-validator-bin/ferrum-edge
        run: |
          set -euo pipefail
          # Edge validates the original orders fixture's TLS file contents.
          # Claim a new directory exclusively; never overwrite existing material.
          umask 077
          cleanup_tls() {
            sudo rm -f -- /etc/ferrum/edge-client.pem /etc/ferrum/edge-client.key \
              /etc/ferrum/alloy-ca.pem /etc/ferrum/alloy-ca.key /etc/ferrum/edge-client.csr
            sudo rmdir -- /etc/ferrum
          }
          sudo mkdir --mode=0700 /etc/ferrum
          trap cleanup_tls EXIT
          sudo chown "$(id -u):$(id -g)" /etc/ferrum
          openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
            -keyout /etc/ferrum/alloy-ca.key -out /etc/ferrum/alloy-ca.pem \
            -subj '/CN=alloy-ci-ca' -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'keyUsage=critical,keyCertSign,cRLSign' >/dev/null 2>&1
          openssl req -new -newkey rsa:2048 -nodes \
            -keyout /etc/ferrum/edge-client.key -out /etc/ferrum/edge-client.csr \
            -subj '/CN=alloy-ci-client' -addext 'basicConstraints=critical,CA:FALSE' \
            -addext 'keyUsage=critical,digitalSignature,keyEncipherment' \
            -addext 'extendedKeyUsage=clientAuth' >/dev/null 2>&1
          openssl x509 -req -in /etc/ferrum/edge-client.csr \
            -CA /etc/ferrum/alloy-ca.pem -CAkey /etc/ferrum/alloy-ca.key \
            -set_serial 2 -days 365 -copy_extensions copy \
            -out /etc/ferrum/edge-client.pem >/dev/null 2>&1
          chmod 0600 /etc/ferrum/alloy-ca.key /etc/ferrum/edge-client.key \
            /etc/ferrum/alloy-ca.pem /etc/ferrum/edge-client.pem /etc/ferrum/edge-client.csr
          openssl verify -CAfile /etc/ferrum/alloy-ca.pem -purpose sslclient \
            /etc/ferrum/edge-client.pem >/dev/null 2>&1
          test_name=unit::companion_schema_tests::alloy_generated_resources_load_assemble_and_validate
          listed=$(cargo test --locked --test unit_tests "$test_name" -- --ignored --exact --list --format terse)
          [ "$(grep -c ': test$' <<< "$listed")" -eq 1 ]
          grep -Fxq "$test_name: test" <<< "$listed"
          cargo test --locked --test unit_tests "$test_name" -- --ignored --exact --nocapture

  gitforgeops-required-static-validation:
    name: gitforgeops-required-static-validation
    if: always()
    needs: [validator-pairing, scope, list-envs, validate]
    runs-on: ubuntu-24.04
    env:
      PAIRING_RESULT: ${{ needs.validator-pairing.result }}
      SCOPE_RESULT: ${{ needs.scope.result }}
      RELEVANT: ${{ needs.scope.outputs.relevant }}
      LIST_RESULT: ${{ needs.list-envs.result }}
      VALIDATE_RESULT: ${{ needs.validate.result }}
    steps:
      - name: Require every applicable validation job
        run: |
          set -euo pipefail
          [ "$PAIRING_RESULT" = success ] || {
            echo "::error::The pinned validator resource-label pairing check did not succeed."
            exit 1
          }
          [ "$SCOPE_RESULT" = success ] || {
            echo "::error::Declarative change classification did not succeed."
            exit 1
          }
          if [ "$RELEVANT" != true ]; then
            echo "No resource, overlay, or repository configuration changes require validation."
            exit 0
          fi
          [ "$LIST_RESULT" = success ] && [ "$VALIDATE_RESULT" = success ] || {
            echo "::error::One or more required static-validation jobs failed or were skipped."
            exit 1
          }
