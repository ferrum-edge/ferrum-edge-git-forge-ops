[package]
name = "gitforgeops"
version = "0.1.0"
edition = "2021"
description = "GitOps workflow for managing Ferrum Edge gateway configuration via pull requests"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/ferrum-edge/ferrum-edge-git-forge-ops"

[[bin]]
name = "gitforgeops"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
serde_ignored = "0.1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
sha2 = "0.11"
hex = "0.4"
walkdir = "2"
# Only HS256 signing is used. The aws-lc provider avoids pulling the RustCrypto
# RSA implementation into the admin-token path; RSA remains solely behind
# `age`'s SSH-recipient support (see docs/dependency-security.md).
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
# Already in the tree as a `reqwest` dependency. Taken directly so
# `FERRUM_GATEWAY_URL` is checked for scheme, host, and embedded credentials by
# the same parser the HTTP client uses, rather than by hand-rolled string work.
url = "2"
tokio = { version = "1", features = ["rt", "macros", "time"] }
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }
crypto_box = { version = "0.9", features = ["seal"] }
rand = "0.10"
age = { version = "0.12", features = ["ssh", "armor"] }
ssh-key = { version = "0.6", features = ["ed25519"] }
# Production dependency: the assembled spec handed to `ferrum-edge validate`
# can contain resolved credentials and must be written 0600 under an
# unpredictable name, and the file target publishes atomically via a temp file
# in the destination directory.
tempfile = "3"

[dev-dependencies]
base64 = "0.23"
