# gitforgeops traffic verification
#
# Rename to `.gitforgeops/smoke.yaml` to give `gitforgeops verify` something to
# check. A successful apply proves the gateway ACCEPTED a configuration write;
# these checks prove it is SERVING it. A staged promotion
# (`promotion.requires` in config.yaml) will not authorize the next
# environment until they pass.
#
# The checks are data, deliberately. There is no hook and no shell: this runs
# in a job that holds deployment credentials, and an arbitrary command in a
# repository file would be a way to spend them.
#
# Requests go to the gateway's DATA plane, whose base URL is the
# FERRUM_VERIFY_BASE_URL environment secret — a different endpoint from the
# admin API in FERRUM_GATEWAY_URL. TLS is always verified: a private CA goes
# in FERRUM_GATEWAY_CA_CERT, and FERRUM_TLS_NO_VERIFY deliberately does not
# reach this path, because a check that accepts any certificate has not
# verified TLS.
#
# A check may send ONLY a verification probe credential. The job holds the
# environment's whole credential bundle, so a `slot:` header is honoured only
# when it names a brokered (`${gh-env-secret:...}`) secret of a Consumer that
# this environment's resources label `gitforgeops/verify-probe: "true"`, and
# only on a GET or HEAD check. Plugin-config and service-discovery slots are
# never sent. Anything else fails `gitforgeops verify` before any request.
# Give the label to a dedicated, low-privilege Consumer that exists to be
# probed, never to a customer:
#
#   kind: Consumer
#   spec:
#     id: "orders-probe"
#     username: "orders-probe"
#     labels:
#       gitforgeops/verify-probe: "true"
#     credentials:
#       keyauth:
#         - key: "${gh-env-secret:alloc=generate}"
#
# Every check is bounded, because verification runs after the gateway changed
# and before the ownership ledger is committed: `attempts` at most 10,
# `timeout_secs` at most 60, `retry_backoff_ms` at most 30000, at most 50
# checks per environment, and at most 15 minutes for an environment's checks
# together when every attempt times out (attempts x timeout_secs, plus the
# backoff pauses). A file over any bound is refused by validate, plan and
# apply before anything changes.

version: 1

environments:
  staging:
    checks:
      # Prove the route exists, reaches its upstream, and answers.
      - name: orders route serves authenticated traffic
        method: GET
        path: /orders/healthz
        headers:
          # The probe Consumer's credential slot. Resolved at run time and
          # never printed; a slot that is not in the bundle FAILS the check
          # rather than sending an empty header.
          X-API-Key:
            slot: ferrum/orders-probe/keyauth/key
        expect_status: 200
        # A freshly applied route can take a moment to become live, so retry —
        # but boundedly. An unbounded wait is a promotion that hangs rather
        # than one that is blocked. This check's worst case is
        # 5 x 10s + (1+2+3+4) x 0.5s = 55s.
        attempts: 5
        timeout_secs: 10
        retry_backoff_ms: 500

      # Prove authentication is ENFORCED, not merely configured. Expecting a
      # 401 is the only way to catch a scoped auth plugin that silently did
      # not attach.
      - name: orders route rejects an unauthenticated request
        method: GET
        path: /orders/healthz
        expect_status: 401
        attempts: 3

      # Prefer GET/HEAD probes; a check that sends a slot must use one. A
      # POST, PATCH or other non-idempotent check is retried only when its
      # connection was never established: after a timeout the endpoint may
      # already have applied it, and a replay would repeat the side effect.
      # Add `replay_safe: true` only if the endpoint genuinely tolerates a
      # replay (an Idempotency-Key header proves nothing by itself).

  # `production` deliberately has no entry here. An environment with no
  # declared check has verified nothing and failed nothing: `gitforgeops
  # verify` reports it as skipped (exit 5), never as a pass. Its own
  # deployment job stays green and records the verification as `skipped`,
  # and a promotion gated on it stays blocked until you say what "serving
  # correctly" means for it. Only a declared check that fails (exit 4), or a
  # verify that cannot run (exit 1), fails the deployment job.
