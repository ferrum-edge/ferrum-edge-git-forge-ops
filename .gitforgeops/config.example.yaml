# gitforgeops repo configuration
#
# Rename to `.gitforgeops/config.yaml` to enable multi-environment support.
# When present, `gitforgeops` reads environment names, overlays, apply
# strategies, and ownership modes from this file. Deployment targeting
# (gateway URL, JWT secret, TLS certs) lives in GitHub Environment Secrets,
# *not* in this file — each env name here maps by-convention to a GitHub
# Environment of the same name.

version: 1

environments:
  staging:
    overlay: staging            # → overlays/staging/
    apply_strategy: incremental
    ownership:
      mode: shared              # repo only manages what it has declared
      drift_report: true        # surface admin-added resources in PR review
      drift_alert_on:
        managed_modified: true
        managed_deleted: true
        unmanaged_added: false  # don't alert on ops-team experiments

  production:
    overlay: production
    apply_strategy: full_replace
    monitoring:
      # Run the nightly drift check in `production-monitor` instead of
      # `production`. A deployment environment requires a reviewer, and GitHub
      # withholds an approval-gated environment's secrets until a human
      # approves the job — so a scheduled check bound to it parks in "waiting
      # for approval" and inspects nothing.
      #
      # Opting in means provisioning `production-monitor` with gateway READ
      # material and nothing else (no state-writer key, no provisioner token,
      # no credential bundles), and accepting that it runs unattended. Left
      # false, monitoring stays approval-gated and the check honestly reports
      # `Not completed`. See docs/github-launch-controls.md §3.1.
      unattended: false
    ownership:
      mode: exclusive           # repo is the source of truth
      namespaces: [ferrum]      # scope of exclusivity (required for exclusive)
      # Checked after overlays and namespace filtering by every desired-state
      # command, including validate/export. Gateway rows use their effective
      # namespace; MeshConfig fragments use resources/<namespace>/mesh/.
      # Unowned fragments fail with their namespace and fragment label: add
      # ownership here or move the fragment. Shared mode does not restrict them.
      drift_report: true
      large_prune_threshold_percent: 25

  sandbox:
    overlay: sandbox
    live_review: false          # file-mode env: skip Admin API PR comparison
    apply_strategy: incremental
    ownership:
      mode: shared
      drift_report: false       # wild-west env; don't flood review comments

default_environment: staging
