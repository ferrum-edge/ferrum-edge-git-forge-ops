# Every field mirrored on `config::schema::PluginConfig`, including the full
# conditional-execution predicate tree: all four `PluginTriggerNode` arms
# (`all` / `any` / `not` / `match`) and every `PluginTriggerMatch` leaf.
#
# `config` is deliberately opaque — a `serde_json::Value` island that
# round-trips verbatim, validated by ferrum-edge rather than mirrored here.
kind: PluginConfig
spec:
  id: every-field-plugin
  plugin_name: key_auth
  namespace: ferrum
  config:
    key_names: [apikey, x-api-key]
    hide_credentials: true
    nested:
      arbitrary: [1, 2, 3]
  scope: proxy
  proxy_id: every-field-proxy
  enabled: true
  priority_override: 1250
  trigger:
    when:
      all:
        - match:
            method: [GET, POST]
            path:
              prefix: ["/every"]
              case_insensitive: true
            host:
              exact: ["api.example.test"]
            sni:
              regex: "^api(-alt)?\\.example\\.test$"
            header:
              name: x-api-key
              presence: present
              value:
                exact: ["expected"]
              multi_value: any
            query:
              name: debug
              presence: absent
              multi_value: all
            cookie:
              name: session
              presence: present
              value:
                prefix: ["s-"]
            protocol: [http1, http2, http3, grpc, grpc_web, websocket, tcp, udp, dtls]
            source_cidr: ["10.0.0.0/8"]
            namespace: [ferrum]
            proxy_id: [every-field-proxy]
            listen_port: [15443]
            consumer:
              presence: present
              value:
                exact: ["every-field-consumer"]
            auth_method: [key_auth]
            spiffe_id:
              presence: present
              value:
                prefix: ["spiffe://mesh/ns/ferrum/"]
        - any:
            - match:
                method: [PUT]
            - not:
                match:
                  method: [DELETE]
  created_at: "2024-01-01T00:00:00Z"
  updated_at: "2024-01-02T00:00:00Z"
