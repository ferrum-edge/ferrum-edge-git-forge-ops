# Example proxy resource — rename this file (remove leading _) to use it.
#
# It delegates its destination to the sibling upstream example
# (resources/ferrum/upstreams/_example.yaml, id `upstream-api-cluster`), so
# enable that file too. For a direct backend instead, drop `upstream_id` and
# set `backend_host` (say "api.internal") with `backend_port: 8443`. Set one
# or the other: a placeholder host left beside `upstream_id` stays a real dial
# target, and the `allowed_backend_domains` policy checks it as one.
#
# kind: Proxy
# spec:
#   id: "proxy-my-api"
#   name: "My API"
#   listen_path: "/api/v1"
#   backend_scheme: https
#   strip_listen_path: true
#   backend_connect_timeout_ms: 5000
#   backend_read_timeout_ms: 30000
#   upstream_id: "upstream-api-cluster"
#   auth_mode: single
#   plugins:
#     - plugin_config_id: "plugin-my-keyauth"
